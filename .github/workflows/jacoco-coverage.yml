name: JaCoCo Coverage

on:
  push:
    branches: [ jacoco-coverage-integration ]
  pull_request:
    branches: [ main, integration ]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Set JAVA_21_HOME
      run: |
        echo "JAVA_21_HOME=$JAVA_HOME_21_X64" >> $GITHUB_ENV
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x dev/gradlew
      
    - name: Initialize cnf workspace
      run: |
        cd dev
        ./gradlew cnf:initialize
      
    - name: Run tests with coverage
      run: |
        cd dev
        ./gradlew test jacocoTestReport --continue
      continue-on-error: true
      
    - name: Generate aggregate coverage report
      run: |
        cd dev
        ./gradlew jacocoRootReport
      continue-on-error: true
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./dev/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true
        
    - name: Add coverage comment to PR
      if: github.event_name == 'pull_request'
      uses: madrapps/jacoco-report@v1.6.1
      with:
        paths: |
          ${{ github.workspace }}/dev/build/reports/jacoco/jacocoRootReport/jacocoRootReport.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        min-coverage-overall: 40
        min-coverage-changed-files: 60
        title: 'JaCoCo Coverage Report'
        update-comment: true
        
    - name: Archive coverage reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-reports
        path: |
          dev/build/reports/jacoco/
        retention-days: 30
        
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          dev/**/build/test-results/**/*.xml
        check_name: Test Results
        comment_mode: off

