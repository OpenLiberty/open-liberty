- stepName: Compile FATs
  workType: Jenkins
  projectName: libertyFATBuilder
  timeoutInMinutes: 1440
  dependsOn:
    - stepName: OL SHA
      awaitOutputProperties: true
    - stepName: WL SHA
      awaitOutputProperties: true
  properties:
    olRepo: ${git.laos.clone.repository.sshUrl}
    olBranch: ${git.laos.clone.checkout.branch}
    olCommit: ${OL SHA:commitSHA}
    wlRepo: ${git.clone.repository.sshUrl}
    wlBranch: ${git.clone.checkout.branch}
    wlCommit: ${WL SHA:commitSHA}
  includeProperties:
    - file: compile.properties