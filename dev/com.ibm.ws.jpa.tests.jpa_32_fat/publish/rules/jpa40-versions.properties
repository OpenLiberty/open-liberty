# Override jakarta.persistence package version range to [4.0,5) so that
# WAR bytecode compiled against JPA 3.2 (version=[3.2,4)) gets re-stamped
# to import JPA 4.0 when running under persistenceContainer-4.0.
# Without this, the transformer leaves the import at [3.2,4) which does not
# resolve against our EclipseLink 4.0 bundle (version=4.0.0).
jakarta.persistence=[4.0,5)
jakarta.persistence.criteria=[4.0,5)
jakarta.persistence.metamodel=[4.0,5)
jakarta.persistence.spi=[4.0,5)
jakarta.persistence.query=[4.0,5)
jakarta.persistence.sql=[4.0,5)
