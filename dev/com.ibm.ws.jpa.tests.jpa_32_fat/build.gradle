// Always pull from mirror so we don't have to upload transitive dependencies to artifactory
apply from: '../wlp-gradle/subprojects/maven-central-mirror.gradle'

ext {
  hibernateVersion    = '7.4.4.Final'
  hibernate40Version  = '8.0.0.Beta1'
}

configurations {
  jpaFatTools {
    transitive = false
  }
  requiredLibs {
    transitive = false
  }
  hibernateJPA32
  hibernateJPA40
}

dependencies {
  jpaFatTools project(':com.ibm.ws.jpa_testframework')
  
  def withoutJakartaAPI = {
      exclude group: 'jakarta.activation', module: 'jakarta.activation-api'
      exclude group: 'jakarta.inject', module: 'jakarta.inject-api'
      exclude group: 'jakarta.persistence', module: 'jakarta.persistence-api'
      exclude group: 'jakarta.transaction', module: 'jakarta.transaction-api'
      exclude group: 'jakarta.xml.bind', module: 'jakarta.xml.bind-api'
  }
    
  hibernateJPA32 "org.hibernate.orm:hibernate-core:${hibernateVersion}", withoutJakartaAPI
  hibernateJPA32 "org.hibernate.orm:hibernate-community-dialects:${hibernateVersion}", withoutJakartaAPI
  hibernateJPA32 "org.hibernate.orm:hibernate-scan-jandex:${hibernateVersion}", withoutJakartaAPI
  hibernateJPA32("org.hibernate.orm:hibernate-jcache:${hibernateVersion}") {
    exclude group: 'org.hibernate.orm', module: 'hibernate-core'
    exclude group: 'org.jboss.logging', module: 'jboss-logging'
  }
  hibernateJPA32("org.ehcache:ehcache:3.10.8:jakarta") {
    transitive = false
  }
  hibernateJPA32("javax.cache:cache-api:1.1.1") {
    transitive = false
  }
  hibernateJPA32("org.slf4j:slf4j-api:1.7.36") {
    transitive = false
  }
  hibernateJPA32("org.slf4j:slf4j-simple:1.7.36") {
    transitive = false
  }

  // Hibernate 8 (JPA 4.0 container backwards-compatibility repeat phase)
  // reuses withoutJakartaAPI closure defined above
  hibernateJPA40 "org.hibernate.orm:hibernate-core:${hibernate40Version}",              withoutJakartaAPI
  hibernateJPA40 "org.hibernate.orm:hibernate-community-dialects:${hibernate40Version}", withoutJakartaAPI
  hibernateJPA40 "org.hibernate.orm:hibernate-scan-jandex:${hibernate40Version}",        withoutJakartaAPI
  hibernateJPA40("org.hibernate.orm:hibernate-jcache:${hibernate40Version}") {
    exclude group: 'org.hibernate.orm', module: 'hibernate-core'
    exclude group: 'org.jboss.logging', module: 'jboss-logging'
  }
  hibernateJPA40("org.ehcache:ehcache:3.10.8:jakarta") {
    transitive = false
  }
  hibernateJPA40("javax.cache:cache-api:1.1.1") {
    transitive = false
  }
  hibernateJPA40("net.bytebuddy:byte-buddy:1.18.10")           { transitive = false }
  hibernateJPA40("org.antlr:antlr4-runtime:4.13.2")            { transitive = false }
  hibernateJPA40("org.jboss.logging:jboss-logging:3.6.3.Final") { transitive = false }
  hibernateJPA40("org.hibernate.models:hibernate-models:1.2.0") { transitive = false }
  hibernateJPA40("io.smallrye:jandex:3.6.0")                   { transitive = false }
  hibernateJPA40("org.glassfish.jaxb:jaxb-runtime:4.0.9")      { transitive = false }
  hibernateJPA40("org.glassfish.jaxb:jaxb-core:4.0.9")         { transitive = false }
  hibernateJPA40("com.sun.istack:istack-commons-runtime:4.1.2") { transitive = false }
  hibernateJPA40("org.slf4j:slf4j-api:1.7.36")                  { transitive = false }
  hibernateJPA40("org.slf4j:slf4j-simple:1.7.36")               { transitive = false }
  hibernateJPA40("org.eclipse.angus:angus-activation:2.0.3")    { transitive = false }
  hibernateJPA40("org.glassfish.jaxb:txw2:4.0.9")              { transitive = false }
}

task addJPAFATTools (type: Copy) {
  mustRunAfter jar
  from configurations.jpaFatTools
  include "**/com.ibm.ws.jpa_testframework.jar"
  into new File(autoFvtDir, 'lib')
}

task addhibernateJPA32(type: Copy) {
  shouldRunAfter jar
  from configurations.hibernateJPA32
  into new File(autoFvtDir, 'publish/shared/resources/jpa_fat_jpa32_hibernate')
}

task addhibernateJPA40(type: Copy) {
  shouldRunAfter jar
  from configurations.hibernateJPA40
  into new File(autoFvtDir, 'publish/shared/resources/jpa_fat_jpa40_hibernate')
}

// ---------------------------------------------------------------------------
// JPA40_HIBERNATE8 repeat phase — recompile the jakartapersistence and
// jakartadata test apps against the JPA 4.0 API and package as separate WARs.
//
// Both servlets use createQuery(String) which moved to the EntityHandler
// superinterface with a different return type (StatementOrTypedQuery) in
// JPA 4.0.  Compiled against JPA 3.2 the call descriptor is (String)→Query;
// the JPA 4.0 runtime only has (String)→StatementOrTypedQuery, so the JVM
// throws NoSuchMethodError.  Recompiling against the 4.0 API fixes the
// descriptors without any source changes.
// ---------------------------------------------------------------------------
task compileJPA40TestApp(type: JavaCompile) {
  dependsOn jar

  source = fileTree('test-applications/jakartapersistence/src')

  classpath = (compileJava.classpath
      .filter { !it.name.contains('jakarta.persistence.3.2') && !it.name.contains('jakarta.persistence.api.3.2') }
      + fileTree(dir: "${rootDir}/build.image/wlp/dev/api/spec", include: 'io.openliberty.jakarta.persistence.4.0_*.jar'))

  destinationDirectory = file("${buildDir}/jpa40AppClasses")
  options.release = 17
}

task packageJPA40TestWar(type: Jar, dependsOn: compileJPA40TestApp) {
  archiveFileName = 'jakartapersistence_jpa40compiled.war'
  destinationDirectory = file("${autoFvtDir}/publish/shared/jpa40war")

  from("${buildDir}/jpa40AppClasses") {
    into 'WEB-INF/classes'
  }
  // Use jpa-4.0 resources which carry explicit <class> listings required by Hibernate 8
  from('test-applications/jakartapersistence/resources/jpa-4.0/web') {
    into '/'
  }
}

task compileJPA40DataTestApp(type: JavaCompile) {
  dependsOn jar

  source = fileTree('test-applications/jakartadata/src')

  classpath = (compileJava.classpath
      .filter { !it.name.contains('jakarta.persistence.3.2') && !it.name.contains('jakarta.persistence.api.3.2') }
      + fileTree(dir: "${rootDir}/build.image/wlp/dev/api/spec", include: 'io.openliberty.jakarta.persistence.4.0_*.jar'))

  destinationDirectory = file("${buildDir}/jpa40DataAppClasses")
  options.release = 17
}

task packageJPA40DataTestWar(type: Jar, dependsOn: compileJPA40DataTestApp) {
  archiveFileName = 'jakartadata_jpa40compiled.war'
  destinationDirectory = file("${autoFvtDir}/publish/shared/jpa40war")

  from("${buildDir}/jpa40DataAppClasses") {
    into 'WEB-INF/classes'
  }
  // Use jpa-4.0 resources which carry explicit <class> listings required by Hibernate 8
  from('test-applications/jakartadata/resources/jpa-4.0/web') {
    into '/'
  }
}

addRequiredLibraries {
  dependsOn addH2
  dependsOn copyJdbcDrivers
  dependsOn addJPAFATTools
  dependsOn addhibernateJPA32
  dependsOn addhibernateJPA40
  dependsOn packageJPA40TestWar
  dependsOn packageJPA40DataTestWar
  dependsOn addJakartaTransformer
  dependsOn copyTestContainers
}
