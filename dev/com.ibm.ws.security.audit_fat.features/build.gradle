apply plugin: 'war'

// We aren't making a war for the entire project
war { enabled = false }

configurations {
  requiredLibs {
    transitive = false
  }
}

dependencies {
  requiredLibs 'org.apache.httpcomponents:httpclient:4.1.2',
               'org.apache.httpcomponents:httpcore:4.1.2',
               project(':com.ibm.ws.security.audit_fat.common.tooling'),
               project(':com.ibm.ws.security.fat.common'),
               project(':com.ibm.json4j')
}

/*
 * The audit test applications and the keystores are provided by the tooling project.
 */
autoFVT.dependsOn ':com.ibm.ws.security.audit_fat.common.tooling:assemble'

autoFVT.doLast {
  def tooling = project(':com.ibm.ws.security.audit_fat.common.tooling')
  def appDir = new File(tooling.buildDir, 'test-application')
  def keyDir = new File(tooling.projectDir, 'securitykeys')
  def serverDir = { String server -> new File(autoFvtDir, "publish/servers/${server}") }

  /*
   * Both servers need both audit applications.
   */
  ['com.ibm.ws.security.audit.fat.dynamic',
   'com.ibm.ws.security.audit.fat.dynamic.config'].each { server ->
    copy {
      from new File(appDir, 'AuditBasicAuthServlet.war')
      from new File(appDir, 'AuditFormLoginServlet.war')
      into new File(serverDir(server), 'apps')
    }
  }

  /*
   * Copy the keystores to the server that signs and/or encrypts the audit log.
   */
  copy {
    from keyDir
    include 'AuditEncryptionKeyStore2.jks',
            'AuditEncryptionKeyStore.jks',
            'AuditSigningKeyStore.jks',
            'AuditSigningKeyStore2.jks'
    into new File(serverDir('com.ibm.ws.security.audit.fat.dynamic.config'), 'resources/security')
  }
}
