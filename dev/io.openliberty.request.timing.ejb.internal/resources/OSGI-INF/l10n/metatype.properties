#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=EJB Timing
ejbTiming.desc=Overrides defaults that are specified in the root attributes of requestTiming for EJB requests.

requestType.name=Request type
requestType.desc=The type of EJB invocation to monitor. Use async for asynchronous EJB method invocations, \
mdb for message-driven bean message deliveries, remote for remote EJB method invocations, \
timer for EJB timer callbacks, or * (asterisk) to monitor all supported types. \
The default is * (asterisk).

requestType.option.all=All supported EJB request types
requestType.option.async=Asynchronous EJB method invocations
requestType.option.mdb=Message-driven bean message deliveries
requestType.option.remote=Remote EJB method invocations
requestType.option.timer=EJB timer callbacks

appName.name=Application name
appName.desc=The name of the EJB application (EAR) to monitor. The application name corresponds to the EAR deployment name. \
Use * (asterisk) to match all applications. If it is not specified, all applications are monitored.

moduleName.name=Module name
moduleName.desc=The name of the EJB module (JAR) within the application to monitor. \
Use * (asterisk) to match all modules. If it is not specified, all modules are monitored.

beanName.name=Bean name
beanName.desc=The name of the EJB to monitor. If it is not specified, all EJBs are monitored.

methodName.name=Method name
methodName.desc=The name of the EJB method to monitor. \
If it is not specified, all methods are monitored.

slowRequestThreshold.name=Slow request threshold
slowRequestThreshold.desc=The length of time that an EJB request can run before the request is considered slow.

hungRequestThreshold.name=Hung request threshold
hungRequestThreshold.desc=The length of time that an EJB request can run before the request is considered hung.

enableThreadDumps.name=Enable thread dumps
enableThreadDumps.desc=Indicates whether thread dumps are created when a hung EJB request is detected. \
When this value is true, thread dumps are created. When this value is false, thread dumps are not created. \
The default value is true.

interruptHungRequests.name=Interrupt hung requests
interruptHungRequests.desc=Indicates whether an EJB request that is hung is to be interrupted. \
When this value is true, the Request Timing feature attempts to interrupt the hung request. \
When this value is false, the hung request continues to run. The default value is false.
