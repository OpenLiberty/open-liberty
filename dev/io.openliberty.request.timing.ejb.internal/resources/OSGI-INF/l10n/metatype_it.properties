#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=Tempistiche EJB
ejbTiming.desc=Sovrascrive le impostazioni predefinite specificate negli attributi radice di ` requestTiming ` per le richieste EJB.

requestType.name=Tipo di richiesta
requestType.desc=Il tipo di invocazione EJB da monitorare. Utilizzare "async" per le chiamate asincrone ai metodi EJB, "mdb" per l'invio di messaggi da parte dei bean guidati dai messaggi (MDB), "remote" per le chiamate remote ai metodi EJB, "timer" per i callback dei timer EJB oppure "*" per monitorare tutti i tipi supportati. Il valore predefinito \u00e8 *.
requestType.option.all=Tutti i tipi di richiesta EJB supportati
requestType.option.async=Chiamate asincrone di metodi EJB
requestType.option.mdb=Consegna dei messaggi dei bean guidati dai messaggi
requestType.option.remote=Chiamate remote a metodi EJB
requestType.option.timer=Callback del timer EJB

appName.name=Nome applicazione
appName.desc=Il nome dell'applicazione EJB (EAR) da monitorare. Corrisponde al nome di distribuzione EAR. Utilizza * per trovare tutte le applicazioni. Se non diversamente specificato, tutte le applicazioni vengono monitorate.

moduleName.name=Nome modulo
moduleName.desc=Il nome del modulo EJB (JAR) all'interno dell'applicazione da monitorare. Utilizza * per selezionare tutti i moduli. Se non diversamente specificato, vengono monitorati tutti i moduli.

beanName.name=Nome bean
beanName.desc=Il nome dell'EJB da monitorare. Se non diversamente specificato, vengono monitorati tutti i bean.

methodName.name=Nome metodo
methodName.desc=Il nome del metodo EJB da monitorare. Se non diversamente specificato, vengono monitorati tutti i metodi.

slowRequestThreshold.name=Soglia richieste lente
slowRequestThreshold.desc=Intervallo di tempo durante il quale una richiesta EJB pu\u00f2 essere in esecuzione prima di essere considerata lenta.

hungRequestThreshold.name=Soglia richieste bloccate
hungRequestThreshold.desc=Intervallo di tempo durante il quale una richiesta EJB pu\u00f2 rimanere in esecuzione prima di essere considerata bloccata.

enableThreadDumps.name=Abilita dump dei thread
enableThreadDumps.desc=Indica se vengono creati dump dei thread quando viene rilevata una richiesta EJB bloccata. Se il valore \u00e8 true (impostazione predefinita), vengono creati i dump dei thread. Se il valore \u00e8 falso, non vengono creati i dump dei thread.

interruptHungRequests.name=Interrompi richieste bloccate
interruptHungRequests.desc=Indica se una richiesta EJB in stallo debba essere interrotta. Il valore true causa il tentativo da parte della funzione requestTiming-1.0 di interrompere la richiesta bloccata. Il valore false permette la continuazione dell'esecuzione della richiesta.
