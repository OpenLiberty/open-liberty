#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=\u010casov\u00e1n\u00ed EJB
ejbTiming.desc=P\u0159ep\u00ed\u0161e v\u00fdchoz\u00ed hodnoty, kter\u00e9 jsou stanoveny v ko\u0159enov\u00fdch atributech ` requestTiming ` pro po\u017eadavky EJB.

requestType.name=Typ po\u017eadavku
requestType.desc=Typ vol\u00e1n\u00ed EJB, kter\u00fd se m\u00e1 sledovat. Pro asynchronn\u00ed vol\u00e1n\u00ed metod EJB pou\u017eijte \u201easync\u201c, pro doru\u010dov\u00e1n\u00ed zpr\u00e1v v r\u00e1mci message-driven bean\u016f \u201emdb\u201c, pro vzd\u00e1len\u00e1 vol\u00e1n\u00ed metod EJB \u201eremote\u201c, pro zp\u011btn\u00e1 vol\u00e1n\u00ed \u010dasova\u010de EJB \u201etimer\u201c nebo \u201e*\u201c pro sledov\u00e1n\u00ed v\u0161ech podporovan\u00fdch typ\u016f. V\u00fdchoz\u00ed hodnota je *.
requestType.option.all=V\u0161echny podporovan\u00e9 typy po\u017eadavk\u016f EJB
requestType.option.async=Asynchronn\u00ed vol\u00e1n\u00ed metod EJB
requestType.option.mdb=Doru\u010dov\u00e1n\u00ed zpr\u00e1v v beanov\u00fdch komponent\u00e1ch \u0159\u00edzen\u00fdch zpr\u00e1vami
requestType.option.remote=Vzd\u00e1len\u00e9 vol\u00e1n\u00ed metod EJB
requestType.option.timer=Zp\u011btn\u00e1 vol\u00e1n\u00ed \u010dasova\u010de EJB

appName.name=N\u00e1zev aplikace
appName.desc=N\u00e1zev EJB aplikace (EAR), kterou chcete sledovat. Odpov\u00edd\u00e1 n\u00e1zvu nasazen\u00ed v syst\u00e9mu EAR. Pomoc\u00ed znaku * vyhled\u00e1te v\u0161echny aplikace. Pokud nen\u00ed uvedeno jinak, jsou sledov\u00e1ny v\u0161echny aplikace.

moduleName.name=N\u00e1zev modulu
moduleName.desc=N\u00e1zev modulu EJB (JAR) v r\u00e1mci aplikace, kterou je t\u0159eba monitorovat. Pro vyhled\u00e1n\u00ed v\u0161ech modul\u016f pou\u017eijte znak *. Pokud nen\u00ed uvedeno jinak, jsou monitorov\u00e1ny v\u0161echny moduly.

beanName.name=N\u00e1zev objektu typu bean
beanName.desc=N\u00e1zev EJB, kter\u00fd m\u00e1 b\u00fdt monitorov\u00e1n. Pokud nen\u00ed uvedeno jinak, jsou sledov\u00e1ny v\u0161echny bean.

methodName.name=N\u00e1zev metody
methodName.desc=N\u00e1zev metody EJB, kterou je t\u0159eba sledovat. Pokud nen\u00ed uvedeno jinak, jsou sledov\u00e1ny v\u0161echny metody.

slowRequestThreshold.name=Prahov\u00e1 hodnota pro pomal\u00e9 po\u017eadavky
slowRequestThreshold.desc=Doba, po kterou m\u016f\u017ee EJB po\u017eadavek b\u011b\u017eet, ne\u017e bude pova\u017eov\u00e1n za pomal\u00fd.

hungRequestThreshold.name=Prahov\u00e1 hodnota pro zablokovan\u00e9 po\u017eadavky
hungRequestThreshold.desc=Doba, po kterou m\u016f\u017ee EJB po\u017eadavek b\u011b\u017eet, ne\u017e bude pova\u017eov\u00e1n za zaseknut\u00fd.

enableThreadDumps.name=Povolit v\u00fdpisy pam\u011bti podprocesu
enableThreadDumps.desc=Ur\u010duje, zda se p\u0159i detekci zablokovan\u00e9 EJB \u017e\u00e1dosti vytvo\u0159\u00ed v\u00fdpisy vl\u00e1kna. Je-li nastaveno na hodnotu true (v\u00fdchoz\u00ed nastaven\u00ed), vytv\u00e1\u0159ej\u00ed se v\u00fdpisy vl\u00e1kna. Je-li tato hodnota nastavena na \u201efalse\u201c, v\u00fdpisy vl\u00e1kna se nevytv\u00e1\u0159ej\u00ed.

interruptHungRequests.name=P\u0159eru\u0161it zablokovan\u00e9 po\u017eadavky
interruptHungRequests.desc=Ur\u010duje, zda m\u00e1 b\u00fdt p\u0159eru\u0161en EJB po\u017eadavek, kter\u00fd se zasekl. Hodnota true zp\u016fsob\u00ed, \u017ee se funkce requestTiming-1.0 pokus\u00ed p\u0159eru\u0161it zablokovan\u00fd po\u017eadavek. Hodnota false umo\u017en\u00ed po\u017eadavku pokra\u010dovat ve zpracov\u00e1n\u00ed.
