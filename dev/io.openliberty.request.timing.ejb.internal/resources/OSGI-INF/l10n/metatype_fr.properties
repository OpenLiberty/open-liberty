#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=Synchronisation EJB
ejbTiming.desc=Remplace les valeurs par d\u00e9faut d\u00e9finies dans les attributs racine de ` requestTiming ` pour les requ\u00eates EJB.

requestType.name=Type de demande
requestType.desc=Le type d'appel EJB \u00e0 surveiller. Utilisez \u00ab async \u00bb pour les appels asynchrones de m\u00e9thodes EJB, \u00ab mdb \u00bb pour les transmissions de messages des beans pilot\u00e9s par messages, \u00ab remote \u00bb pour les appels \u00e0 distance de m\u00e9thodes EJB, \u00ab timer \u00bb pour les rappels de minuterie EJB, ou \u00ab * \u00bb pour surveiller tous les types pris en charge. La valeur par d\u00e9faut est *.
requestType.option.all=Tous les types de requ\u00eates EJB pris en charge
requestType.option.async=Appels asynchrones de m\u00e9thodes EJB
requestType.option.mdb=Transmissions de messages par les beans pilot\u00e9s par les messages
requestType.option.remote=Appels de m\u00e9thodes EJB \u00e0 distance
requestType.option.timer=Rappels de minuterie EJB

appName.name=Nom de l'application
appName.desc=Nom de l'application EJB (EAR) \u00e0 surveiller. Correspond au nom de d\u00e9ploiement EAR. Utilisez * pour rechercher toutes les applications. Sauf indication contraire, toutes les applications sont surveill\u00e9es.

moduleName.name=Nom du module
moduleName.desc=Le nom du module EJB (JAR) au sein de l'application \u00e0 surveiller. Utilisez * pour faire correspondre tous les modules. Si aucune pr\u00e9cision n'est donn\u00e9e, tous les modules sont surveill\u00e9s.

beanName.name=Nom du bean
beanName.desc=Le nom de l'EJB \u00e0 surveiller. Si aucune indication n'est fournie, tous les beans sont surveill\u00e9s.

methodName.name=Nom de la m\u00e9thode
methodName.desc=Nom de la m\u00e9thode EJB \u00e0 surveiller. Sauf indication contraire, toutes les m\u00e9thodes sont surveill\u00e9es.

slowRequestThreshold.name=Seuil de demande lente
slowRequestThreshold.desc=Dur\u00e9e pendant laquelle une requ\u00eate EJB peut s'ex\u00e9cuter avant d'\u00eatre consid\u00e9r\u00e9e comme lente.

hungRequestThreshold.name=Seuil de demande suspendue
hungRequestThreshold.desc=Dur\u00e9e pendant laquelle une requ\u00eate EJB peut s'ex\u00e9cuter avant d'\u00eatre consid\u00e9r\u00e9e comme bloqu\u00e9e.

enableThreadDumps.name=Activer les clich\u00e9s d'unit\u00e9 d'ex\u00e9cution
enableThreadDumps.desc=Indique si des vidages de threads sont cr\u00e9\u00e9s lorsqu'une requ\u00eate EJB bloqu\u00e9e est d\u00e9tect\u00e9e. Lorsque cette option est activ\u00e9e (par d\u00e9faut), des vidages de threads sont cr\u00e9\u00e9s. Si cette option est d\u00e9sactiv\u00e9e, les vidages de thread ne sont pas cr\u00e9\u00e9s.

interruptHungRequests.name=Interrompre demandes suspendues
interruptHungRequests.desc=Indique si une requ\u00eate EJB bloqu\u00e9e doit \u00eatre interrompue. Lorsque la valeur true est sp\u00e9cifi\u00e9e, la fonction requestTiming-1.0 tente d'interrompre la demande suspendue. Lorsque la valeur false est sp\u00e9cifi\u00e9e, la demande continue de s'ex\u00e9cuter.
