#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=Tempo de resposta do EJB
ejbTiming.desc=Substitui os valores padr\u00e3o especificados nos atributos raiz de ` requestTiming ` para solicita\u00e7\u00f5es EJB.

requestType.name=Tipo de pedido
requestType.desc=O tipo de invoca\u00e7\u00e3o de EJB a ser monitorada. Use \u201casync\u201d para chamadas ass\u00edncronas de m\u00e9todos EJB, \u201cmdb\u201d para entregas de mensagens de beans orientados a mensagens, \u201cremote\u201d para chamadas remotas de m\u00e9todos EJB, \u201ctimer\u201d para callbacks de temporizadores EJB ou \u201c*\u201d para monitorar todos os tipos suportados. O padr\u00e3o \u00e9 *.
requestType.option.all=Todos os tipos de solicita\u00e7\u00e3o EJB compat\u00edveis
requestType.option.async=Chamadas ass\u00edncronas de m\u00e9todos EJB
requestType.option.mdb=Entregas de mensagens em beans orientados a mensagens
requestType.option.remote=Invoca\u00e7\u00f5es remotas de m\u00e9todos EJB
requestType.option.timer=Callbacks de temporizador do EJB

appName.name=Nome do aplicativo
appName.desc=O nome da aplica\u00e7\u00e3o EJB (EAR) a ser monitorada. Corresponde ao nome da implanta\u00e7\u00e3o do EAR. Use * para encontrar todos os aplicativos. Se n\u00e3o for especificado, todos os aplicativos ser\u00e3o monitorados.

moduleName.name=Nome do M\u00f3dulo
moduleName.desc=O nome do m\u00f3dulo EJB (JAR) dentro do aplicativo a ser monitorado. Use * para selecionar todos os m\u00f3dulos. Se n\u00e3o for especificado, todos os m\u00f3dulos ser\u00e3o monitorados.

beanName.name=Nome de bean
beanName.desc=O nome do EJB a ser monitorado. Se n\u00e3o for especificado, todos os beans ser\u00e3o monitorados.

methodName.name=Nome do M\u00e9todo
methodName.desc=O nome do m\u00e9todo EJB a ser monitorado. Se n\u00e3o for especificado, todos os m\u00e9todos s\u00e3o monitorados.

slowRequestThreshold.name=Limite de solicita\u00e7\u00e3o lenta
slowRequestThreshold.desc=Tempo durante o qual uma solicita\u00e7\u00e3o EJB pode ser executada antes de ser considerada lenta.

hungRequestThreshold.name=Limite de solicita\u00e7\u00e3o interrompida
hungRequestThreshold.desc=Per\u00edodo de tempo durante o qual uma solicita\u00e7\u00e3o EJB pode ser executada antes de ser considerada travada.

enableThreadDumps.name=Ativar dumps de encadeamento
enableThreadDumps.desc=Indica se s\u00e3o gerados dumps de threads quando \u00e9 detectada uma solicita\u00e7\u00e3o EJB travada. Quando estiver definido como \u201ctrue\u201d (padr\u00e3o), s\u00e3o criados dumps de threads. Quando o valor for falso, os dumps de threads n\u00e3o ser\u00e3o criados.

interruptHungRequests.name=Interromper as solicita\u00e7\u00f5es interrompidas
interruptHungRequests.desc=Indica se uma solicita\u00e7\u00e3o de EJB que esteja travada deve ser interrompida. Um valor de true faz com que o recurso requestTiming-1.0 tente interromper uma solicita\u00e7\u00e3o interrompida. Um valor de false permite que a solicita\u00e7\u00e3o continue sendo executada.
