#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=EJB-Timing
ejbTiming.desc=\u00dcberschreibt die Standardwerte, die in den Stammattributen von \u201e requestTiming \u201c f\u00fcr EJB-Anfragen festgelegt sind.

requestType.name=Anforderungstyp
requestType.desc=Die Art des zu \u00fcberwachenden EJB-Aufrufs. Verwenden Sie \u201easync\u201c f\u00fcr asynchrone EJB-Methodenaufrufe, \u201emdb\u201c f\u00fcr die Zustellung von Nachrichten durch Message-Driven Beans, \u201eremote\u201c f\u00fcr entfernte EJB-Methodenaufrufe, \u201etimer\u201c f\u00fcr EJB-Timer-Callbacks oder \u201e*\u201c, um alle unterst\u00fctzten Typen zu \u00fcberwachen. Die Standardeinstellung lautet *.
requestType.option.all=Alle unterst\u00fctzten EJB-Anforderungstypen
requestType.option.async=Asynchrone EJB-Methodenaufrufe
requestType.option.mdb=Nachrichten\u00fcbermittlung bei Message-Driven Beans
requestType.option.remote=Aufrufe von EJB-Methoden aus der Ferne
requestType.option.timer=EJB-Timer-Callbacks

appName.name=Anwendungsname
appName.desc=Der Name der zu \u00fcberwachenden EJB-Anwendung (EAR). Entspricht dem EAR-Bereitstellungsnamen. Verwenden Sie *, um alle Anwendungen zu finden. Sofern nicht anders angegeben, werden alle Anwendungen \u00fcberwacht.

moduleName.name=Modulname
moduleName.desc=Der Name des EJB-Moduls (JAR) innerhalb der zu \u00fcberwachenden Anwendung. Verwenden Sie *, um alle Module zu finden. Sofern nicht anders angegeben, werden alle Module \u00fcberwacht.

beanName.name=Bean-Name
beanName.desc=Der Name des zu \u00fcberwachenden EJB. Sofern nicht anders angegeben, werden alle Beans \u00fcberwacht.

methodName.name=Methodenname
methodName.desc=Der Name der zu \u00fcberwachenden EJB-Methode. Sofern nicht anders angegeben, werden alle Methoden \u00fcberwacht.

slowRequestThreshold.name=Schwellenwert f\u00fcr langsame Anforderungen
slowRequestThreshold.desc=Zeitraum, in dem eine EJB-Anfrage ausgef\u00fchrt werden kann, bevor sie als langsam eingestuft wird.

hungRequestThreshold.name=Schwellenwert f\u00fcr blockierte Anforderungen
hungRequestThreshold.desc=Zeitdauer, w\u00e4hrend der eine EJB-Anfrage ausgef\u00fchrt werden kann, bevor sie als h\u00e4ngend gilt.

enableThreadDumps.name=Threadspeicherausz\u00fcge aktivieren
enableThreadDumps.desc=Gibt an, ob Thread-Dumps erstellt werden, wenn eine h\u00e4ngende EJB-Anfrage erkannt wird. Wenn \u201etrue\u201c (Standard), werden Thread-Dumps erstellt. Wenn dieser Wert \u201efalse\u201c ist, werden keine Thread-Dumps erstellt.

interruptHungRequests.name=Blockierte Anforderungen unterbrechen
interruptHungRequests.desc=Gibt an, ob eine h\u00e4ngengebliebene EJB-Anfrage abgebrochen werden soll. Der Wert true bewirkt, dass das Feature requestTiming-1.0 versucht, die blockierte Anforderung zu unterbrechen. Der Wert false l\u00e4sst die Fortsetzung der Anforderung zu.
