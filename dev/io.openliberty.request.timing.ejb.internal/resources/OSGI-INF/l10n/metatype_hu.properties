#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=EJB id\u0151z\u00edt\u00e9s
ejbTiming.desc=Fel\u00fcl\u00edrja az EJB-k\u00e9relmekre vonatkoz\u00f3 \u201e requestTiming \u201d gy\u00f6k\u00e9rattrib\u00fatumaiban megadott alap\u00e9rtelmezett \u00e9rt\u00e9keket.

requestType.name=K\u00e9r\u00e9s t\u00edpusa
requestType.desc=A figyelemmel k\u00eds\u00e9rend\u0151 EJB-h\u00edv\u00e1s t\u00edpusa. Haszn\u00e1lja az \u201easync\u201d parancsot az aszinkron EJB-m\u00f3dszerh\u00edv\u00e1sokhoz, az \u201emdb\u201d parancsot az \u00fczenetvez\u00e9relt bean-ek \u00fczenetk\u00fcld\u00e9seihez, a \u201eremote\u201d parancsot a t\u00e1voli EJB-m\u00f3dszerh\u00edv\u00e1sokhoz, az \u201etimer\u201d parancsot az EJB-id\u0151z\u00edt\u0151 visszah\u00edv\u00e1sokhoz, vagy a * karaktert az \u00f6sszes t\u00e1mogatott t\u00edpus figyel\u00e9s\u00e9hez. Az alap\u00e9rtelmezett \u00e9rt\u00e9k *.
requestType.option.all=Minden t\u00e1mogatott EJB-k\u00e9r\u00e9s t\u00edpus
requestType.option.async=Aszinkron EJB-m\u00f3dszerh\u00edv\u00e1sok
requestType.option.mdb=\u00dczenetvez\u00e9relt bean-ek \u00fczenetk\u00fcld\u00e9sei
requestType.option.remote=T\u00e1voli EJB-m\u00f3dszerh\u00edv\u00e1sok
requestType.option.timer=EJB id\u0151z\u00edt\u0151-visszah\u00edv\u00e1sok

appName.name=Alkalmaz\u00e1s neve
appName.desc=A figyelemmel k\u00eds\u00e9rend\u0151 EJB-alkalmaz\u00e1s (EAR) neve. Az EAR-telep\u00edt\u00e9s nev\u00e9nek felel meg. A * karakterrel az \u00f6sszes alkalmaz\u00e1sra r\u00e1kereshet. Ha nincs m\u00e1sk\u00e9nt megadva, akkor az \u00f6sszes alkalmaz\u00e1s figyelemmel k\u00eds\u00e9r\u00e9se t\u00f6rt\u00e9nik.

moduleName.name=Moduln\u00e9v
moduleName.desc=A figyelni k\u00edv\u00e1nt alkalmaz\u00e1son bel\u00fcli EJB-modul (JAR) neve. A * karakterrel az \u00f6sszes modulra vonatkoz\u00f3 keres\u00e9st v\u00e9gezhet. Ha nincs megadva, akkor az \u00f6sszes modul figyelemmel k\u00eds\u00e9r\u00e9se t\u00f6rt\u00e9nik.

beanName.name=Komponens neve
beanName.desc=A figyelemmel k\u00eds\u00e9rend\u0151 EJB neve. Ha nincs m\u00e1sk\u00e9nt megadva, akkor az \u00f6sszes bean fel\u00fcgyelet al\u00e1 ker\u00fcl.

methodName.name=Met\u00f3dus neve
methodName.desc=A figyelni k\u00edv\u00e1nt EJB-m\u00f3dszer neve. Ha nincs megadva, akkor az \u00f6sszes m\u00f3dszert figyelemmel k\u00eds\u00e9rik.

slowRequestThreshold.name=Lass\u00fa k\u00e9r\u00e9sek k\u00fcsz\u00f6b\u00e9rt\u00e9ke
slowRequestThreshold.desc=Az az id\u0151tartam, ameddig egy EJB-k\u00e9r\u00e9s futhat, miel\u0151tt lass\u00fanak min\u0151s\u00fclne.

hungRequestThreshold.name=Lefagyott k\u00e9r\u00e9sek k\u00fcsz\u00f6b\u00e9rt\u00e9ke
hungRequestThreshold.desc=Az az id\u0151tartam, amely alatt egy EJB-k\u00e9r\u00e9s futhat, miel\u0151tt \u201elefagyottnak\u201d min\u0151s\u00fclne.

enableThreadDumps.name=Sz\u00e1lki\u00edrat\u00e1s enged\u00e9lyez\u00e9se
enableThreadDumps.desc=Meghat\u00e1rozza, hogy l\u00e9trehoz\u00f3dnak-e sz\u00e1lki\u00edr\u00e1sok, ha egy lefagyott EJB-k\u00e9r\u00e9s \u00e9szlel\u00e9sre ker\u00fcl. Ha igaz (alap\u00e9rtelmezett), akkor sz\u00e1lki\u00edr\u00e1sok k\u00e9sz\u00fclnek. Ha hamis, akkor nem k\u00e9sz\u00fclnek sz\u00e1lki\u00edr\u00e1sok.

interruptHungRequests.name=Lefagyott k\u00e9r\u00e9sek megszak\u00edt\u00e1sa
interruptHungRequests.desc=Meghat\u00e1rozza, hogy egy lefagyott EJB-k\u00e9r\u00e9s megszak\u00edt\u00e1sra ker\u00fclj\u00f6n-e. A true \u00e9rt\u00e9k megad\u00e1sa eset\u00e9n a requestTiming-1.0 szolg\u00e1ltat\u00e1s megk\u00eds\u00e9rli megszak\u00edtani a lefagyott k\u00e9r\u00e9st. A false \u00e9rt\u00e9k lehet\u0151v\u00e9 teszi, hogy a k\u00e9r\u00e9s tov\u00e1bb fusson.
