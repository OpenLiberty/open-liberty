#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=Sincronizarea EJB
ejbTiming.desc=Suprascrie valorile implicite specificate \u00een atributele de baz\u0103 ale \u201e requestTiming \u201d pentru solicit\u0103rile EJB.

requestType.name=Tipul cererii
requestType.desc=Tipul de apel EJB care urmeaz\u0103 s\u0103 fie monitorizat. Utiliza\u021bi \u201easync\u201d pentru apelurile asincrone ale metodelor EJB, \u201emdb\u201d pentru transmiterea mesajelor c\u0103tre bean-urile conduse de mesaje, \u201eremote\u201d pentru apelurile la distan\u021b\u0103 ale metodelor EJB, \u201etimer\u201d pentru apelurile de returnare ale temporizatorului EJB sau \u201e*\u201d pentru a monitoriza toate tipurile acceptate. Valoarea implicit\u0103 este *.
requestType.option.all=Toate tipurile de solicit\u0103ri EJB acceptate
requestType.option.async=Apeluri asincrone ale metodelor EJB
requestType.option.mdb=Transmiterea mesajelor c\u0103tre bean-urile bazate pe mesaje
requestType.option.remote=Apeluri la distan\u021b\u0103 ale metodelor EJB
requestType.option.timer=Callback-uri pentru temporizatorul EJB

appName.name=Nume aplica\u0163ie
appName.desc=Numele aplica\u021biei EJB (EAR) care urmeaz\u0103 s\u0103 fie monitorizat\u0103. Corespunde denumirii de implementare EAR. Folosi\u021bi * pentru a selecta toate aplica\u021biile. Dac\u0103 nu se specific\u0103 altfel, toate aplica\u021biile sunt monitorizate.

moduleName.name=Nume modul
moduleName.desc=Numele modulului EJB (JAR) din cadrul aplica\u021biei care urmeaz\u0103 s\u0103 fie monitorizat\u0103. Folosi\u021bi * pentru a selecta toate modulele. Dac\u0103 nu se specific\u0103 altfel, toate modulele sunt monitorizate.

beanName.name=Nume bean
beanName.desc=Numele EJB-ului care urmeaz\u0103 s\u0103 fie monitorizat. Dac\u0103 nu se specific\u0103 altfel, toate bean-urile sunt monitorizate.

methodName.name=Nume metod\u0103
methodName.desc=Numele metodei EJB care urmeaz\u0103 s\u0103 fie monitorizat\u0103. Dac\u0103 nu se specific\u0103 altfel, toate metodele sunt monitorizate.

slowRequestThreshold.name=Pragul de cerere lent\u0103
slowRequestThreshold.desc=Intervalul de timp \u00een care o solicitare EJB poate rula \u00eenainte de a fi considerat\u0103 lent\u0103.

hungRequestThreshold.name=Pragul de cerere ag\u0103\u0163at\u0103
hungRequestThreshold.desc=Intervalul de timp \u00een care o cerere EJB poate rula \u00eenainte de a fi considerat\u0103 blocat\u0103.

enableThreadDumps.name=Activare dump-uri de fire de execu\u0163ie
enableThreadDumps.desc=Indic\u0103 dac\u0103 se creeaz\u0103 fi\u0219iere de memorie (thread dumps) atunci c\u00e2nd se detecteaz\u0103 o solicitare EJB blocat\u0103. C\u00e2nd este setat\u0103 la \u201etrue\u201d (implicit), se creeaz\u0103 fi\u0219iere de memorie ale thread-urilor. C\u00e2nd valoarea este fals\u0103, nu se creeaz\u0103 dump-uri de thread.

interruptHungRequests.name=\u00centreruperea cererilor blocate
interruptHungRequests.desc=Indic\u0103 dac\u0103 o cerere EJB care s-a blocat trebuie \u00eentrerupt\u0103. O valoare de True determin\u0103 caracteristica requestTiming-1.0 s\u0103 \u00eencerce s\u0103 \u00eentrerup\u0103 cererea blocat\u0103. O valoarea de False permite cererii s\u0103 continue s\u0103 ruleze.
