#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=Czas dzia\u0142ania EJB
ejbTiming.desc=Zast\u0119puje warto\u015bci domy\u015blne okre\u015blone w atrybutach g\u0142\u00f3wnych elementu ` requestTiming ` dla \u017c\u0105da\u0144 EJB.

requestType.name=Typ \u017c\u0105dania
requestType.desc=Rodzaj wywo\u0142ania EJB, kt\u00f3re ma by\u0107 monitorowane. U\u017cyj opcji \u201easync\u201d do monitorowania asynchronicznych wywo\u0142a\u0144 metod EJB, \u201emdb\u201d do dostarczania komunikat\u00f3w przez fasolki sterowane komunikatami (MDB), \u201eremote\u201d do zdalnych wywo\u0142a\u0144 metod EJB, \u201etimer\u201d do wywo\u0142a\u0144 zwrotnych timer\u00f3w EJB lub \u201e*\u201d, aby monitorowa\u0107 wszystkie obs\u0142ugiwane typy. Warto\u015bci\u0105 domy\u015bln\u0105 jest *.
requestType.option.all=Wszystkie obs\u0142ugiwane typy \u017c\u0105da\u0144 EJB
requestType.option.async=Asynchroniczne wywo\u0142ania metod EJB
requestType.option.mdb=Dostarczanie komunikat\u00f3w przez fasolki sterowane komunikatami
requestType.option.remote=Zdalne wywo\u0142ania metod EJB
requestType.option.timer=Wywo\u0142ania zwrotne timera EJB

appName.name=Nazwa aplikacji
appName.desc=Nazwa aplikacji EJB (pliku EAR), kt\u00f3ra ma by\u0107 monitorowana. Odpowiada nazwie wdro\u017cenia w systemie EAR. U\u017cyj znaku *, aby dopasowa\u0107 wszystkie aplikacje. Je\u015bli nie okre\u015blono inaczej, monitorowane s\u0105 wszystkie aplikacje.

moduleName.name=Nazwa modu\u0142u
moduleName.desc=Nazwa modu\u0142u EJB (pliku JAR) w ramach aplikacji, kt\u00f3r\u0105 ma by\u0107 monitorowana. U\u017cyj znaku *, aby dopasowa\u0107 wszystkie modu\u0142y. Je\u015bli nie okre\u015blono inaczej, monitorowane s\u0105 wszystkie modu\u0142y.

beanName.name=Nazwa komponentu Bean
beanName.desc=Nazwa komponentu EJB, kt\u00f3ry ma by\u0107 monitorowany. Je\u015bli nie okre\u015blono inaczej, monitorowane s\u0105 wszystkie komponenty typu bean.

methodName.name=Nazwa metody
methodName.desc=Nazwa metody EJB, kt\u00f3r\u0105 nale\u017cy monitorowa\u0107. Je\u015bli nie okre\u015blono inaczej, monitorowane s\u0105 wszystkie metody.

slowRequestThreshold.name=Pr\u00f3g powolnych \u017c\u0105da\u0144
slowRequestThreshold.desc=Czas, przez jaki \u017c\u0105danie EJB mo\u017ce by\u0107 wykonywane, zanim zostanie uznane za powolne.

hungRequestThreshold.name=Pr\u00f3g zawieszonych \u017c\u0105da\u0144
hungRequestThreshold.desc=Czas, przez jaki \u017c\u0105danie EJB mo\u017ce by\u0107 wykonywane, zanim zostanie uznane za zawieszone.

enableThreadDumps.name=W\u0142\u0105cz zrzuty w\u0105tk\u00f3w
enableThreadDumps.desc=Wskazuje, czy w przypadku wykrycia zawieszonego \u017c\u0105dania EJB tworzone s\u0105 zrzuty w\u0105tk\u00f3w. Gdy warto\u015b\u0107 jest prawdziwa (ustawienie domy\u015blne), tworzone s\u0105 zrzuty w\u0105tk\u00f3w. Gdy warto\u015b\u0107 jest fa\u0142szywa, zrzuty w\u0105tk\u00f3w nie s\u0105 tworzone.

interruptHungRequests.name=Przerwanie zawieszonych \u017c\u0105da\u0144
interruptHungRequests.desc=Wskazuje, czy zawieszone \u017c\u0105danie EJB ma zosta\u0107 przerwane. Warto\u015b\u0107 true powoduje, \u017ce funkcja requestTiming-1.0 podejmuje pr\u00f3b\u0119 przerwania zawieszonego \u017c\u0105dania. Warto\u015b\u0107 false umo\u017cliwia kontynuowanie dzia\u0142ania \u017c\u0105dania.
