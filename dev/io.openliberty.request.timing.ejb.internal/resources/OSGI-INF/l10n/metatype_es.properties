#CMVCPATHNAME io.openliberty.request.timing.ejb.internal/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

ejbTiming.name=Tiempo de ejecuci\u00f3n de EJB
ejbTiming.desc=Anula los valores predeterminados especificados en los atributos ra\u00edz de \u00ab requestTiming \u00bb para las solicitudes EJB.

requestType.name=Tipo de solicitud
requestType.desc=El tipo de invocaci\u00f3n de EJB que se va a supervisar. Utiliza \u00abasync\u00bb para las invocaciones as\u00edncronas de m\u00e9todos EJB, \u00abmdb\u00bb para el env\u00edo de mensajes de beans controlados por mensajes, \u00abremote\u00bb para las invocaciones remotas de m\u00e9todos EJB, \u00abtimer\u00bb para las devoluciones de llamada del temporizador EJB o \u00ab*\u00bb para supervisar todos los tipos compatibles. El valor por defecto es *.
requestType.option.all=Todos los tipos de solicitud EJB compatibles
requestType.option.async=Invocaciones as\u00edncronas de m\u00e9todos EJB
requestType.option.mdb=Entrega de mensajes de los beans controlados por mensajes
requestType.option.remote=Invocaciones remotas de m\u00e9todos EJB
requestType.option.timer=Llamadas de retorno del temporizador de EJB

appName.name=Nombre de aplicaci\u00f3n
appName.desc=El nombre de la aplicaci\u00f3n EJB (EAR) que se va a supervisar. Corresponde al nombre de implementaci\u00f3n de EAR. Utiliza * para buscar todas las aplicaciones. Si no se especifica lo contrario, se supervisan todas las aplicaciones.

moduleName.name=Nombre de m\u00f3dulo
moduleName.desc=El nombre del m\u00f3dulo EJB (JAR) dentro de la aplicaci\u00f3n que se va a supervisar. Utiliza * para buscar todos los m\u00f3dulos. Si no se especifica lo contrario, se supervisan todos los m\u00f3dulos.

beanName.name=Nombre del bean
beanName.desc=El nombre del EJB que se va a supervisar. Si no se especifica lo contrario, se supervisan todos los beans.

methodName.name=Nombre de m\u00e9todo
methodName.desc=El nombre del m\u00e9todo EJB que se va a supervisar. Si no se especifica lo contrario, se supervisan todos los m\u00e9todos.

slowRequestThreshold.name=Umbral de solicitud lenta
slowRequestThreshold.desc=Tiempo durante el cual una solicitud EJB puede ejecutarse antes de que se considere lenta.

hungRequestThreshold.name=Umbral de solicitud bloqueada
hungRequestThreshold.desc=Tiempo durante el cual una solicitud EJB puede ejecutarse antes de que se considere que se ha bloqueado.

enableThreadDumps.name=Habilitar volcados de hebras
enableThreadDumps.desc=Indica si se crean volcados de subprocesos cuando se detecta una solicitud EJB bloqueada. Cuando el valor es \u00abtrue\u00bb (por defecto), se crean volcados de subprocesos. Si el valor es \u00abfalse\u00bb, no se crean volcados de subprocesos.

interruptHungRequests.name=Interrumpir solicitudes bloqueadas
interruptHungRequests.desc=Indica si se debe interrumpir una solicitud EJB que se haya quedado bloqueada. Un valor de true hace que la caracter\u00edstica requestTiming-1.0 intente interrumpir la solicitud bloqueada. Un valor de false permite que se siga ejecutando la solicitud.
