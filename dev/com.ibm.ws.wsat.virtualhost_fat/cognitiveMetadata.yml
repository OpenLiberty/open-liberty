purpose: >
  FAT for the wsAtomicTransaction virtualHostRef configuration attribute.
  Tests that the WS-AT web service WAB binds only to the configured virtual
  host's ports (port-binding tests) and that EPR URLs published by the server
  contain only the configured virtual host's port (EPR URL test). Also includes
  an end-to-end two-server WS-AT transaction test with the coordinator server
  configured with virtualHostRef.
