mcpServer.name=模型上下文协议（MCP）服务器
mcpServer.description=配置MCP服务器功能。

stateless.name=无状态模式
stateless.description=无状态模式会禁用服务器对MCP会话的跟踪。 此模式消除了在集群环境中对会话亲和性的需求。 否则，同一服务器将处理来自同一MCP会话的请求。 由于服务器上不存储任何会话数据，任何服务器实例都能处理任何请求，这简化了负载均衡和水平扩展。 然而，无状态模式也会禁用依赖会话跟踪或将独立的 HTTP 请求关联起来的MCP功能，例如取消工具调用。

moduleName.name=模块名
moduleName.description=EAR 文件中的模块名称。 选择配置所适用的模块。

path.name=端点路径
path.description=此 MCP 端点的 URL 路径，相对于模块上下文根目录。 设置该模块内的 MCP 端点路径。

sessionTimeout.name=会话超时
sessionTimeout.description=MCP 会话的超时时长。 经过这段空闲时间后，会话将过期并从服务器中删除。 请指定一个正整数，后跟一个时间单位。

asyncTimeout.name=异步请求超时
asyncTimeout.description=异步 MCP 工具调用的超时时长。 如果异步工具调用未能在该时间内完成，则将被取消。 请指定一个正整数，后跟一个时间单位。

info.name=MCP 服务器信息
info.description=初始化期间返回给客户端的 MCP 服务器元数据配置。

info.name.name=服务器名称
info.name.description=此 MCP 服务器的名称标识符。 MCP 客户端使用此显示名称来识别服务器。

info.title.name=服务器名称
info.title.description=该 MCP 服务器的易于理解的标题，用于界面和用户场景。

info.version.name=服务器版本
info.version.description=此 MCP 服务器的版本字符串。 该值用于跟踪服务器版本。

info.description.name=服务器描述
info.description.description=此 MCP 服务器的描述字符串。 该值描述了该实现对客户端或服务端的功能和用途。
