mcpServer.name=Server protokolu Model Context Protocol (MCP)
mcpServer.description=Nakonfigurujte funkci serveru MCP.

stateless.name=Režim bez stavu
stateless.description=Režim bez stavu zakáže serveru sledování relací MCP. Tento režim eliminuje potřebu afinity relace v clusterovém prostředí. V opačném případě zpracovává stejný server požadavky ze stejné relace MCP. Protože na serverech nejsou uložena žádná data o relacích, může jakákoli instance serveru zpracovat jakýkoli požadavek, což zjednodušuje vyvažování zatížení a horizontální škálování. Bezstavový režim však také deaktivuje funkce MCP, které se opírají o sledování relací nebo propojování samostatných požadavků HTTP, jako je například zrušení volání nástroje.

moduleName.name=Název modulu
moduleName.description=Název modulu v souboru EAR. Vybere modul, na který se konfigurace vztahuje.

path.name=Cesta ke koncovému bodu
path.description=Cesta typu „ URL “ pro tento koncový bod MCP, relativně k kořenovému adresáři kontextu modulu. Nastaví cestu ke koncovému bodu MCP v rámci daného modulu.

sessionTimeout.name=Časový limit relace
sessionTimeout.description=Doba časového limitu pro relace MCP. Po uplynutí této doby nečinnosti vyprší platnost relace a ta bude ze serveru odstraněna. Zadejte kladné celé číslo následované jednotkou času.

asyncTimeout.name=Časový limit asynchronního požadavku
asyncTimeout.description=Doba časového limitu pro asynchronní volání nástrojů MCP. Pokud se asynchronní volání nástroje v tomto časovém limitu nedokončí, bude zrušeno. Zadejte kladné celé číslo následované jednotkou času.

info.name=Informace o serveru MCP
info.description=Nastavení metadat serveru MCP, která se klientům vrací během inicializace.

info.name.name=Název serveru
info.name.description=Identifikátor názvu tohoto serveru MCP. Tento zobrazovaný název používají klienti MCP k identifikaci serveru.

info.title.name=Název serveru
info.title.description=Člověkem srozumitelný název tohoto serveru MCP, určený pro uživatelské rozhraní a uživatelské kontexty.

info.version.name=Verze serveru
info.version.description=Řetězec označující verzi tohoto serveru MCP. Tato hodnota slouží ke sledování verze serveru.

info.description.name=Popis serveru
info.description.description=Popisný řetězec pro tento server MCP. Tato hodnota popisuje účel a možnosti dané implementace pro klienty nebo servery.
