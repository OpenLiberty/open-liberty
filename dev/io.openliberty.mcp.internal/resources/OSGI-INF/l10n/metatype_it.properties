mcp.name=Server del Model Context Protocol (MCP)
mcp.description=Configurare la funzionalità MCP.

stateless.name=Modalità senza stato
stateless.description=La modalità senza stato disabilita il tracciamento delle sessioni MCP da parte del server. Questa modalità elimina la necessità dell''affinità di sessione in un ambiente clusterizzato. Altrimenti, lo stesso server gestisce le richieste provenienti dalla stessa sessione MCP. Poiché sui server non vengono memorizzati dati relativi alle sessioni, qualsiasi istanza server è in grado di gestire qualsiasi richiesta, semplificando il bilanciamento del carico e il ridimensionamento orizzontale. Tuttavia, la modalità senza stato disabilita anche le funzionalità MCP che si basano sul tracciamento delle sessioni o sul collegamento di richieste separate HTTP, come l''annullamento di una chiamata a uno strumento.

moduleName.name=Nome modulo
moduleName.description=Il nome del modulo in un file EAR. Seleziona il modulo a cui si applica la configurazione.

path.name=Percorso dell''endpoint
path.description=Il percorso URL per questo endpoint MCP, relativo alla radice del contesto del modulo. Imposta il percorso dell''endpoint MCP all''interno di quel modulo.

sessionTimeout.name=Timeout sessione
sessionTimeout.description=La durata del timeout per le sessioni MCP. Trascorso questo periodo di inattività, la sessione scade e viene rimossa dal server. Specificare un numero intero positivo seguito da un''unità di tempo.

asyncTimeout.name=Timeout di richiesta asincrona
asyncTimeout.description=La durata del timeout per le chiamate asincrone allo strumento MCP. Se una chiamata a uno strumento asincrono non viene completata entro tale intervallo di tempo, verrà annullata. Specificare un numero intero positivo seguito da un''unità di tempo.

info.name=Informazioni sul server MCP
info.description=Configurazione dei metadati del server MCP restituiti ai client durante l''inizializzazione.

info.name.name=Nome server
info.name.description=L''identificatore del nome di questo server MCP. Questo nome di visualizzazione viene utilizzato dai client MCP per identificare il server.

info.title.name=Titolo del server
info.title.description=Un titolo di facile comprensione per questo server MCP, destinato all''interfaccia utente e ai contesti utente.

info.version.name=Versione del server
info.version.description=La stringa di versione di questo server MCP. Questo valore serve a identificare la versione del server.

info.description.name=Descrizione server
info.description.description=La stringa descrittiva di questo server MCP. Questo valore descrive lo scopo e le funzionalità dell''implementazione per i client o i server.
