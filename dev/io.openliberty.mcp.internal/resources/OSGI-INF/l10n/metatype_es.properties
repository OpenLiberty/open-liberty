mcpServer.name=Servidor de protocolo de contexto de modelo (MCP)
mcpServer.description=Configure la función del servidor MCP.

stateless.name=Modo sin estado
stateless.description=El modo sin estado desactiva el seguimiento de sesiones MCP por parte del servidor. Este modo elimina la necesidad de afinidad de sesión en un entorno en clúster. De lo contrario, el mismo servidor gestiona las solicitudes de la misma sesión MCP. Dado que no se almacenan datos de sesión en los servidores, cualquier instancia del servidor puede gestionar cualquier solicitud, lo que simplifica el equilibrio de carga y el escalado horizontal. Sin embargo, el modo sin estado también deshabilita las funciones MCP que dependen del seguimiento de sesiones o de la vinculación de solicitudes HTTP independientes, como la cancelación de una llamada a una herramienta.

moduleName.name=Nombre de módulo
moduleName.description=El nombre del módulo en un archivo EAR. Selecciona el módulo al que se aplica la configuración.

path.name=Ruta del punto final
path.description=La ruta « URL » de este punto final MCP, relativa a la raíz del contexto del módulo. Establece la ruta del punto final MCP dentro de ese módulo.

sessionTimeout.name=Tiempo de espera de sesión
sessionTimeout.description=La duración del tiempo de espera de las sesiones MCP. Tras este periodo de inactividad, la sesión caduca y se elimina del servidor. Indica un número entero positivo seguido de una unidad de tiempo.

asyncTimeout.name=Tiempo de espera de solicitud asíncrona
asyncTimeout.description=La duración del tiempo de espera para las llamadas asíncronas a la herramienta MCP. Si una llamada asíncrona a una herramienta no se completa en ese plazo, se cancelará. Indica un número entero positivo seguido de una unidad de tiempo.

info.name=Información del servidor MCP
info.description=Configuración de los metadatos del servidor MCP que se envían a los clientes durante la inicialización.

info.name.name=Nombre de servidor
info.name.description=El identificador de nombre de este servidor MCP. Los clientes de MCP utilizan este nombre de visualización para identificar el servidor.

info.title.name=Título del servidor
info.title.description=Un título legible para este servidor MCP, destinado a la interfaz de usuario y a los contextos de usuario.

info.version.name=Versión del servidor
info.version.description=La cadena de versión de este servidor MCP. Este valor se utiliza para identificar la versión del servidor.

info.description.name=Descripción del servidor
info.description.description=La cadena de descripción de este servidor MCP. Este valor describe la finalidad y las capacidades de la implementación para clientes o servidores.
