mcp.name=Modellkontextus-protokoll (MCP) szerver
mcp.description=Konfigurálja az MCP Server funkciót.

stateless.name=Állam nélküli mód
stateless.description=A stateless mód letiltja az MCP munkamenet nyomon követését a szerver által. Ez a mód megszünteti a munkamenet-affinitás szükségességét klaszterezett környezetben. Ellenkező esetben ugyanaz a szerver kezeli az ugyanazon MCP munkamenetből érkező kéréseket. Mivel a szervereken nem tárolnak munkamenetadatokat, bármelyik szerverpéldány képes bármilyen kérést feldolgozni, ami egyszerűsíti a terheléselosztást és a horizontális méretezést. A stateless mód azonban letiltja azokat az MCP funkciókat is, amelyek a munkamenet nyomon követésén vagy különálló HTTP kérések összekapcsolásán alapulnak, például az eszközhívás törlését.

moduleName.name=Modulnév
moduleName.description=A modul neve egy EAR-fájlban. Kiválasztja azt a modult, amelyre a konfiguráció vonatkozik.

path.name=Végpont elérési útvonala
path.description=Az MCP végpont „ URL ” elérési útja, a modul gyökérkönyvtárához viszonyítva. Meghatározza az MCP végpont elérési útját az adott modulon belül.

sessionTimeout.name=Munkamenet időtúllépése
sessionTimeout.description=Az MCP-munkamenetek időtúllépési ideje. Ezen inaktivitási időszak letelte után a munkamenet lejár, és a szerverről eltávolításra kerül. Adjon meg egy pozitív egész számot, amelyet egy időegység követ.

asyncTimeout.name=Aszinkron kérés időkorlát
asyncTimeout.description=Az aszinkron MCP-eszközhívások időkorlátjának időtartama. Ha egy aszinkron eszközhívás nem fejeződik be ezen időn belül, akkor a rendszer megszakítja azt. Adjon meg egy pozitív egész számot, amelyet egy időegység követ.

info.name=MCP-kiszolgáló adatai
info.description=Az MCP-kiszolgáló metaadatainak konfigurációja, amelyeket az inicializálás során visszaküldenek az ügyfeleknek.

info.name.name=Kiszolgáló neve
info.name.description=Ennek az MCP-kiszolgálónak a névazonosítója. Ezt a megjelenítési nevet az MCP-kliensek használják a szerver azonosítására.

info.title.name=A szerver neve
info.title.description=Az MCP-kiszolgáló számára megadott, ember számára olvasható cím, amelyet a felhasználói felület és a felhasználói kontextusok számára szántak.

info.version.name=Kiszolgáló verzió
info.version.description=Ennek az MCP-kiszolgálónak a verziószáma. Ez az érték a szerver verziójának nyomon követésére szolgál.

info.description.name=Kiszolgáló leírása
info.description.description=Ennek az MCP-kiszolgálónak a leíró karakterlánca. Ez az érték leírja a megvalósítás célját és képességeit az ügyfelek vagy a szerverek szempontjából.
