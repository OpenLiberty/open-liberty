mcpServer.name=Serveur MCP (Model Context Protocol)
mcpServer.description=Configurez la fonctionnalité Serveur MCP.

stateless.name=Mode sans état
stateless.description=Le mode sans état désactive le suivi des sessions MCP par le serveur. Ce mode supprime le besoin d''affinité de session dans un environnement en cluster. Sinon, le même serveur traite les requêtes provenant de la même session MCP. Comme aucune donnée de session n''est stockée sur les serveurs, n''importe quelle instance de serveur peut traiter n''importe quelle requête, ce qui simplifie l''équilibrage de charge et la mise à l''échelle horizontale. Cependant, le mode sans état désactive également les fonctionnalités MCP qui reposent sur le suivi des sessions ou la liaison entre différentes requêtes d'' HTTP, telles que l''annulation d''un appel d''outil.

moduleName.name=Nom du module
moduleName.description=Le nom du module dans un fichier EAR. Sélectionne le module auquel s''applique la configuration.

path.name=Chemin d''accès au point de terminaison
path.description=Le chemin d''accès « URL » pour ce point de terminaison MCP, par rapport à la racine du contexte du module. Définit le chemin d''accès au point de terminaison MCP au sein de ce module.

sessionTimeout.name=Délai d''expiration de la session
sessionTimeout.description=La durée du délai d''expiration des sessions MCP. Au terme de cette période d''inactivité, la session expire et est supprimée du serveur. Indiquez un nombre entier positif suivi d''une unité de temps.

asyncTimeout.name=Dépassement de délai pour les demandes asynchrones
asyncTimeout.description=Durée du délai d''attente pour les appels asynchrones à l''outil MCP. Si l''exécution d''un appel asynchrone à un outil ne s''achève pas dans ce délai, elle sera annulée. Indiquez un nombre entier positif suivi d''une unité de temps.

info.name=Informations sur le serveur MCP
info.description=Configuration des métadonnées du serveur MCP renvoyées aux clients lors de l''initialisation.

info.name.name=Nom du serveur
info.name.description=L''identifiant de ce serveur MCP. Ce nom d''affichage est utilisé par les clients MCP pour identifier le serveur.

info.title.name=Nom du serveur
info.title.description=Un titre lisible par l''utilisateur pour ce serveur MCP, destiné à l''interface utilisateur et aux contextes utilisateur.

info.version.name=Version du serveur
info.version.description=La chaîne de version de ce serveur MCP. Cette valeur sert à identifier la version du serveur.

info.description.name=Description du serveur
info.description.description=La chaîne de description de ce serveur MCP. Cette valeur décrit l''objectif et les fonctionnalités de l''implémentation pour les clients ou les serveurs.
