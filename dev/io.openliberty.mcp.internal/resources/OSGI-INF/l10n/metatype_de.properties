mcp.name=Model Context Protocol (MCP)-Server
mcp.description=Konfigurieren Sie die MCP-Funktion.

stateless.name=Stateless-Modus
stateless.description=Der stateless-Modus deaktiviert die MCP-Sitzungsverfolgung durch den Server. Dieser Modus macht die Sitzungsaffinität in einer Clusterumgebung überflüssig. Andernfalls bearbeitet derselbe Server Anfragen aus derselben MCP-Sitzung. Da keine Sitzungsdaten auf den Servern gespeichert werden, kann jede Serverinstanz jede Anfrage bearbeiten, was die Lastverteilung und horizontale Skalierung vereinfacht. Der stateless-Modus deaktiviert jedoch auch MCP-Funktionen, die auf der Sitzungsverfolgung oder der Verknüpfung separater HTTP -Anfragen basieren, wie beispielsweise das Abbrechen eines Toolaufrufs.

moduleName.name=Modulname
moduleName.description=Der Name des Moduls in einer EAR-Datei. Wählt das Modul aus, für das die Konfiguration gilt.

path.name=Endpunktpfad
path.description=Der Pfad „ URL “ für diesen MCP-Endpunkt, relativ zum Stammverzeichnis des Modulkontexts. Legt den Pfad zum MCP-Endpunkt innerhalb dieses Moduls fest.

sessionTimeout.name=Sitzungszeitlimit
sessionTimeout.description=Die Zeitüberschreitungsdauer für MCP-Sitzungen. Nach dieser Inaktivitätszeit läuft die Sitzung ab und wird vom Server gelöscht. Geben Sie eine positive ganze Zahl gefolgt von einer Zeiteinheit an.

asyncTimeout.name=Zeitlimit für asynchrone Anforderungen
asyncTimeout.description=Die Zeitüberschreitungsdauer für asynchrone MCP-Tool-Aufrufe. Wird ein asynchroner Tool-Aufruf nicht innerhalb dieser Zeit abgeschlossen, wird er abgebrochen. Geben Sie eine positive ganze Zahl gefolgt von einer Zeiteinheit an.

info.name=Informationen zum MCP-Server
info.description=Konfiguration der MCP-Server-Metadaten, die während der Initialisierung an die Clients zurückgegeben werden.

info.name.name=Servername
info.name.description=Der Name dieses MCP-Servers. Dieser Anzeigename wird von MCP-Clients zur Identifizierung des Servers verwendet.

info.title.name=Server-Titel
info.title.description=Ein für Menschen lesbarer Titel für diesen MCP-Server, der für die Benutzeroberfläche und Benutzerkontexte vorgesehen ist.

info.version.name=Serverversion
info.version.description=Die Versionszeichenfolge für diesen MCP-Server. Dieser Wert dient zur Erfassung der Serverversion.

info.description.name=Serverbeschreibung
info.description.description=Die Beschreibungszeichenfolge für diesen MCP-Server. Dieser Wert beschreibt den Zweck und die Funktionen der Implementierung für Clients oder Server.
