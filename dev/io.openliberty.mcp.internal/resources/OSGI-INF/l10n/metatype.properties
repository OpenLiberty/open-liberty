mcpServer.name=Model Context Protocol (MCP) Server
mcpServer.description=Configure the MCP Server feature.

stateless.name=Stateless mode
stateless.description=Stateless mode disables MCP session tracking by the server. This removes the need for sticky sessions in a clustered environment, where requests from the same MCP session would otherwise need to be handled by the same server instance. Because no session data is stored on the servers, any server instance can handle any request, which simplifies load balancing and horizontal scaling. However, stateless mode also disables MCP features that rely on session tracking or linking separate HTTP requests together, such as canceling a tool call.