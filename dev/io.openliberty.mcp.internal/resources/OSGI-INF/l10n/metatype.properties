mcpServer.name=Model Context Protocol (MCP) Server
mcpServer.description=Configure the MCP Server feature.

stateless.name=Stateless mode
stateless.description=Stateless mode disables session tracking by the server. This removes the need for sticky sessions where a client must always hit the same server instance. Because no session data is stored on a single node, any server instance can handle any request, which simplifies load balancing and improves horizontal scalability in clustered deployments. However, stateless mode also disables MCP features that rely on session tracking or linking separate HTTP requests together, such as canceling a tool call.