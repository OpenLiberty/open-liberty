mcp.name=Serwer protokołu kontekstowego modelu (MCP)
mcp.description=Skonfiguruj funkcję serwera MCP.

stateless.name=Tryb bezstanowy
stateless.description=Tryb bezstanowy wyłącza śledzenie sesji MCP przez serwer. Ten tryb eliminuje potrzebę stosowania powinowactwa sesji w środowisku klastrowym. W przeciwnym razie ten sam serwer obsługuje żądania z tej samej sesji MCP. Ponieważ na serwerach nie są przechowywane żadne dane sesji, każda instancja serwera może obsłużyć dowolne żądanie, co upraszcza równoważenie obciążenia i skalowanie horyzontalne. Jednak tryb bezstanowy wyłącza również funkcje MCP, które opierają się na śledzeniu sesji lub łączeniu oddzielnych żądań HTTP, takich jak anulowanie wywołania narzędzia.

moduleName.name=Nazwa modułu
moduleName.description=Nazwa modułu w pliku EAR. Wybiera moduł, do którego odnosi się konfiguracja.

path.name=Ścieżka do punktu końcowego
path.description=Ścieżka typu „ URL ” dla tego punktu końcowego MCP, liczona względem katalogu głównego modułu. Ustawia ścieżkę punktu końcowego MCP w ramach tego modułu.

sessionTimeout.name=Limit czasu sesji
sessionTimeout.description=Czas oczekiwania dla sesji MCP. Po upływie tego okresu bezczynności sesja wygasa i zostaje usunięta z serwera. Należy podać dodatnią liczbę całkowitą, po której następuje jednostka czasu.

asyncTimeout.name=Limit czasu żądania asynchronicznego
asyncTimeout.description=Czas oczekiwania dla asynchronicznych wywołań narzędzia MCP. Jeśli asynchroniczne wywołanie narzędzia nie zakończy się w tym czasie, zostanie ono anulowane. Należy podać dodatnią liczbę całkowitą, po której następuje jednostka czasu.

info.name=Informacje o serwerze MCP
info.description=Konfiguracja metadanych serwera MCP, które są zwracane klientom podczas inicjalizacji.

info.name.name=Nazwa serwera
info.name.description=Identyfikator nazwy tego serwera MCP. Ta nazwa wyświetlana służy klientom MCP do identyfikacji serwera.

info.title.name=Nazwa serwera
info.title.description=Tytuł tego serwera MCP, zrozumiały dla człowieka, przeznaczony do wykorzystania w interfejsie użytkownika i kontekstach użytkownika.

info.version.name=Wersja serwera
info.version.description=Ciąg znaków określający wersję tego serwera MCP. Ta wartość służy do identyfikacji wersji serwera.

info.description.name=Opis serwera
info.description.description=Ciąg znaków opisujący ten serwer MCP. Wartość ta opisuje przeznaczenie i możliwości danej implementacji dla klientów lub serwerów.
