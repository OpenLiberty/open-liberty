mcp.name=Servidor do Protocolo de Contexto de Modelo (MCP)
mcp.description=Configure o recurso MCP.

stateless.name=Modo sem estado
stateless.description=O modo sem estado desativa o rastreamento de sessões MCP pelo servidor. Este modo elimina a necessidade de afinidade de sessão em um ambiente em cluster. Caso contrário, o mesmo servidor processa as solicitações da mesma sessão MCP. Como nenhum dado da sessão é armazenado nos servidores, qualquer instância do servidor pode lidar com qualquer solicitação, o que simplifica o balanceamento de carga e o dimensionamento horizontal. No entanto, o modo sem estado também desativa os recursos do MCP que dependem do rastreamento de sessão ou da vinculação de solicitações separadas HTTP, como o cancelamento de uma chamada de ferramenta.

moduleName.name=Nome do Módulo
moduleName.description=O nome do módulo em um EAR. Seleciona o módulo ao qual a configuração se aplica.

path.name=Caminho do ponto final
path.description=O caminho URL para este ponto de extremidade MCP, relativo à raiz do contexto do módulo. Define o caminho do ponto de extremidade MCP dentro desse módulo.

sessionTimeout.name=Tempo limite de sessão
sessionTimeout.description=A duração do tempo limite para sessões MCP. Após esse período de inatividade, a sessão expira e é removida do servidor. Especifique um número inteiro positivo seguido de uma unidade de tempo.

asyncTimeout.name=Tempo limite da\nsolicitação assíncrona
asyncTimeout.description=A duração do tempo limite para chamadas assíncronas da ferramenta MCP. Se uma chamada assíncrona a uma ferramenta não for concluída dentro desse prazo, ela será cancelada. Especifique um número inteiro positivo seguido de uma unidade de tempo.

info.name=Informações sobre o servidor MCP
info.description=Configuração dos metadados do servidor MCP que são retornados aos clientes durante a inicialização.

info.name.name=Nome do servidor
info.name.description=O identificador de nome deste servidor MCP. Esse nome de exibição é usado pelos clientes MCP para identificar o servidor.

info.title.name=Título do servidor
info.title.description=Um título legível para este servidor MCP, destinado à interface do usuário e aos contextos do usuário.

info.version.name=Versão do servidor
info.version.description=A string de versão deste servidor MCP. Esse valor é usado para rastrear a versão do servidor.

info.description.name=Descrição do servidor
info.description.description=A string de descrição deste servidor MCP. Esse valor descreve a finalidade e os recursos da implementação para clientes ou servidores.
