mcp.name=模型上下文協定（MCP）伺服器
mcp.description=設定 MCP 功能。

stateless.name=無狀態模式
stateless.description=無狀態模式會停用伺服器對 MCP 會話的追蹤功能。 此模式可消除叢集環境中對工作階段親和性的需求。 否則，同一台伺服器會處理來自相同 MCP 會話的請求。 由於伺服器上不儲存任何會話資料，任何伺服器實例皆可處理任何請求，這簡化了負載平衡與水平擴展的操作。 然而，無狀態模式也會停用依賴於會話追蹤或串聯獨立 HTTP 請求的MCP功能，例如取消工具呼叫。

moduleName.name=模組名稱
moduleName.description=EAR 檔案中的模組名稱。 選取此設定所適用的模組。

path.name=端點路徑
path.description=此 MCP 端點的 URL 路徑，以模組上下文根目錄為基準。 設定該模組內的 MCP 端點路徑。

sessionTimeout.name=階段作業逾時值
sessionTimeout.description=MCP 連線的超時時間。 經過這段閒置時間後，該會話即會過期並從伺服器中移除。 請指定一個正整數，後面接上時間單位。

asyncTimeout.name=非同步要求逾時值
asyncTimeout.description=異步 MCP 工具呼叫的超時時間。 如果非同步工具呼叫未能在該時間內完成，則會被取消。 請指定一個正整數，後面接上時間單位。

info.name=MCP 伺服器資訊
info.description=初始化期間回傳給客戶端的 MCP 伺服器元資料設定。

info.name.name=伺服器名稱
info.name.description=此 MCP 伺服器的名稱識別碼。 MCP 客戶端會使用此顯示名稱來識別伺服器。

info.title.name=伺服器名稱
info.title.description=此 MCP 伺服器的易讀標題，供使用者介面及使用者情境使用。

info.version.name=伺服器版本
info.version.description=此 MCP 伺服器的版本字串。 此值用於追蹤伺服器版本。

info.description.name=伺服器說明
info.description.description=此 MCP 伺服器的描述字串。 此值描述該實作對客戶端或伺服器的用途與功能。
