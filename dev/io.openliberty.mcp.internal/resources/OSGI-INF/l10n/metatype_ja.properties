mcpServer.name=モデルコンテキストプロトコル（MCP）サーバー
mcpServer.description=MCP サーバー機能を構成します。

stateless.name=ステートレスモード
stateless.description=ステートレスモードでは、サーバーによるMCPセッションの追跡が無効化されます。 このモードでは、クラスタ環境におけるセッションアフィニティの必要性がなくなります。 そうでない場合、同じサーバーが同じMCPセッションからのリクエストを処理します。 サーバーにセッションデータが保存されないため、どのサーバーインスタンスでもあらゆるリクエストを処理でき、これにより負荷分散と水平スケーリングが簡素化されます。 ただし、ステートレスモードでは、セッション追跡や個別の HTTP リクエストの連結に依存するMCP機能（ツール呼び出しのキャンセルなど）も無効になります。

moduleName.name=モジュール名
moduleName.description=EAR内のモジュールの名前。 設定を適用するモジュールを選択します。

path.name=エンドポイントのパス
path.description=このMCPエンドポイントの URL パス（モジュールコンテキストのルートを基準とした相対パス）。 そのモジュール内のMCPエンドポイントのパスを設定します。

sessionTimeout.name=セッション・タイムアウト
sessionTimeout.description=MCP セッションのタイムアウト時間。 この間、操作が行われないまま経過すると、セッションは期限切れとなり、サーバーから削除されます。 正の整数を指定し、その後に時間の単位を指定してください。

asyncTimeout.name=非同期要求タイムアウト
asyncTimeout.description=非同期MCPツール呼び出しのタイムアウト時間。 非同期のツール呼び出しがこの時間内に完了しない場合、その呼び出しはキャンセルされます。 正の整数を指定し、その後に時間の単位を指定してください。

info.name=MCP サーバー情報
info.description=初期化時にクライアントに返されるMCPサーバーのメタデータに関する設定。

info.name.name=サーバー名
info.name.description=このMCPサーバーの名前識別子。 この表示名は、MCPクライアントがサーバーを識別するために使用されます。

info.title.name=サーバー名
info.title.description=このMCPサーバーの、UIやユーザー向けの文脈で使用される、人間が読みやすいタイトル。

info.version.name=サーバー・バージョン
info.version.description=このMCPサーバーのバージョン文字列。 この値は、サーバーのバージョンを追跡するために使用されます。

info.description.name=サーバーの説明
info.description.description=このMCPサーバーの説明文字列。 この値は、クライアントまたはサーバー向けの実装の目的と機能について記述したものです。
