mcpServer.name=모델 컨텍스트 프로토콜(MCP) 서버
mcpServer.description=MCP 서버 기능을 구성하십시오.

stateless.name=무상태 모드
stateless.description=무상태 모드는 서버의 MCP 세션 추적을 비활성화합니다. 이 모드는 클러스터 환경에서 세션 어피니티 설정이 필요 없도록 합니다. 그렇지 않으면 동일한 서버가 동일한 MCP 세션의 요청을 처리합니다. 서버에 세션 데이터가 저장되지 않기 때문에, 모든 서버 인스턴스가 모든 요청을 처리할 수 있어 부하 분산 및 수평 확장이 간소화됩니다. 그러나 상태 비저장 모드는 세션 추적에 의존하거나 별도의 HTTP 요청을 연결하는 MCP 기능(예: 도구 호출 취소)도 비활성화합니다.

moduleName.name=모듈 이름
moduleName.description=EAR 파일 내 모듈의 이름. 구성이 적용될 모듈을 선택합니다.

path.name=엔드포인트 경로
path.description=이 MCP 엔드포인트의 URL 경로(모듈 컨텍스트 루트 기준). 해당 모듈 내의 MCP 엔드포인트 경로를 설정합니다.

sessionTimeout.name=세션 제한시간
sessionTimeout.description=MCP 세션의 타임아웃 기간. 이 기간 동안 아무런 활동이 없으면 세션이 만료되어 서버에서 삭제됩니다. 양수 정수를 입력한 뒤 시간 단위를 지정하십시오.

asyncTimeout.name=비동기 요청 제한시간
asyncTimeout.description=비동기 MCP 도구 호출에 대한 타임아웃 기간입니다. 비동기 도구 호출이 이 시간 내에 완료되지 않으면 취소됩니다. 양수 정수를 입력한 뒤 시간 단위를 지정하십시오.

info.name=MCP 서버 정보
info.description=초기화 과정에서 클라이언트에 반환되는 MCP 서버 메타데이터에 대한 구성입니다.

info.name.name=서버 이름
info.name.description=이 MCP 서버의 이름 식별자입니다. 이 표시 이름은 MCP 클라이언트가 서버를 식별하는 데 사용됩니다.

info.title.name=서버 제목
info.title.description=UI 및 사용자 환경에서 사용하기 위한, 이 MCP 서버의 사람이 읽기 쉬운 제목입니다.

info.version.name=서버 버전
info.version.description=이 MCP 서버의 버전 문자열입니다. 이 값은 서버 버전을 파악하는 데 사용됩니다.

info.description.name=서버 설명
info.description.description=이 MCP 서버에 대한 설명 문자열입니다. 이 값은 클라이언트 또는 서버에 대한 구현의 목적과 기능을 설명합니다.
