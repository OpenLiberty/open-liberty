mcpServer.name=Server Protocol Context Model (MCP)
mcpServer.description=Configurați funcția MCP Server.

stateless.name=Modul fără stare
stateless.description=Modul fără stare dezactivează urmărirea sesiunilor MCP de către server. Acest mod elimină necesitatea afinității sesiunii într-un mediu clusterizat. În caz contrar, același server gestionează cererile din aceeași sesiune MCP. Deoarece pe servere nu sunt stocate date de sesiune, orice instanță de server poate gestiona orice solicitare, ceea ce simplifică echilibrarea încărcării și scalarea orizontală. Cu toate acestea, modul fără stare dezactivează și funcțiile MCP care se bazează pe urmărirea sesiunilor sau pe conectarea cererilor separate HTTP, cum ar fi anularea unui apel de instrument.

moduleName.name=Nume modul
moduleName.description=Numele modulului dintr-un fișier EAR. Selectează modulul la care se aplică configurația.

path.name=Calea către punctul final
path.description=Calea „ URL ” pentru acest punct final MCP, relativă la rădăcina contextului modulului. Stabilește calea către punctul final MCP în cadrul acelui modul.

sessionTimeout.name=Timeout sesiune
sessionTimeout.description=Durata de expirare a sesiunilor MCP. După această perioadă de inactivitate, sesiunea expiră și este eliminată de pe server. Specificați un număr întreg pozitiv urmat de o unitate de timp.

asyncTimeout.name=Timeout cerere asincronă
asyncTimeout.description=Durata de așteptare pentru apelurile asincrone către instrumentul MCP. Dacă o apelare asincronă a unui instrument nu se finalizează în acest interval de timp, aceasta va fi anulată. Specificați un număr întreg pozitiv urmat de o unitate de timp.

info.name=Informații despre serverul MCP
info.description=Configurația metadatelor serverului MCP care sunt returnate clienților în timpul inițializării.

info.name.name=Nume server
info.name.description=Identificatorul de nume al acestui server MCP. Acest nume de afișare este utilizat de clienții MCP pentru a identifica serverul.

info.title.name=Titlul serverului
info.title.description=Un titlu ușor de înțeles pentru acest server MCP, destinat interfeței cu utilizatorul și contextelor de utilizare.

info.version.name=Versiunea serverului
info.version.description=Șirul de caractere care indică versiunea acestui server MCP. Această valoare este utilizată pentru a identifica versiunea serverului.

info.description.name=Descrierea serverului
info.description.description=Șirul de descriere pentru acest server MCP. Această valoare descrie scopul și capacitățile implementării pentru clienți sau servere.
