mcpServer.name=Сервер протокола контекста модели (MCP)
mcpServer.description=Настройте функцию MCP Server.

stateless.name=Режим без состояния
stateless.description=Режим без состояния отключает отслеживание сеансов MCP сервером. Этот режим устраняет необходимость в привязке сеансов в кластерной среде. В противном случае один и тот же сервер обрабатывает запросы из одной и той же сессии MCP. Поскольку на серверах не хранятся данные сеансов, любой экземпляр сервера может обрабатывать любой запрос, что упрощает балансировку нагрузки и горизонтальное масштабирование. Однако режим без состояния также отключает функции MCP, которые зависят от отслеживания сеансов или связывания отдельных запросов HTTP, такие как отмена вызова инструмента.

moduleName.name=Имя модуля
moduleName.description=Имя модуля в файле EAR. Выбирает модуль, к которому применяется конфигурация.

path.name=Путь к конечной точке
path.description=Путь URL для этой конечной точки MCP, относительно корневого каталога модуля. Задает путь к конечной точке MCP в данном модуле.

sessionTimeout.name=Тайм-аут сеанса
sessionTimeout.description=Продолжительность таймаута для сеансов MCP. По истечении этого периода бездействия сессия теряет силу и удаляется с сервера. Укажите положительное целое число, за которым следует единица времени.

asyncTimeout.name=Тайм-аут асинхронного запроса
asyncTimeout.description=Продолжительность таймаута для асинхронных вызовов инструментов MCP. Если асинхронный вызов инструмента не завершится в течение этого времени, он будет отменен. Укажите положительное целое число, за которым следует единица времени.

info.name=Информация о сервере MCP
info.description=Настройки метаданных сервера MCP, которые возвращаются клиентам во время инициализации.

info.name.name=Имя сервера
info.name.description=Идентификатор имени данного сервера MCP. Это отображаемое имя используется клиентами MCP для идентификации сервера.

info.title.name=Название сервера
info.title.description=Удобное для восприятия человеком название данного сервера MCP, предназначенное для использования в пользовательском интерфейсе и контекстах взаимодействия с пользователем.

info.version.name=Версия сервера
info.version.description=Строка версии данного сервера MCP. Это значение используется для отслеживания версии сервера.

info.description.name=Описание сервера
info.description.description=Строка описания для этого сервера MCP. Это значение описывает назначение и возможности данной реализации для клиентов или серверов.
