networkFramework=Network Framework
networkFramework.desc=Defines the configuration settings for the server network framework.

eventGroupMinThreads=Minimum threads
eventGroupMinThreads.desc=The minimum number of active worker threads maintained for I/O processing. Specify a value of 0 or greater. A value of 0 allows all worker threads to be suspended when idle. The default value is 1.

eventGroupMaxThreads=Maximum threads
eventGroupMaxThreads.desc=The maximum number of worker threads available for I/O processing. Specify a value greater than 0 and greater than or equal to the minimum thread count. Large values can increase memory and CPU overhead because each worker thread requires dedicated system resources. The default value is 4.
