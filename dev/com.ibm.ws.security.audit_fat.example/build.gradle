apply plugin: 'war'

// We aren't making a war for the entire project
war { enabled = false }

configurations {
  requiredLibs {
    transitive = false
  }
}

dependencies {
  requiredLibs 'org.apache.httpcomponents:httpclient:4.1.2',
               'org.apache.httpcomponents:httpcore:4.1.2',
               project(':com.ibm.ws.security.audit_fat.common.tooling'),
               project(':com.ibm.json4j')
}

/*
 * The audit test applications are built by the tooling project.
 */
autoFVT.dependsOn ':com.ibm.ws.security.audit_fat.common.tooling:assemble'

autoFVT.doLast {
  def toolingBuildDir = project(':com.ibm.ws.security.audit_fat.common.tooling').buildDir

  /*
   * Copy the audit test applications to the example server.
   */
  copy {
    from new File(toolingBuildDir, 'test-application/AuditBasicAuthServlet.war')
    from new File(toolingBuildDir, 'test-application/AuditFormLoginServlet.war')
    into new File(autoFvtDir, 'publish/servers/com.ibm.ws.security.audit.fat.example/apps')
  }
}
