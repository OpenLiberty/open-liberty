configurations {
	  prometheusRegistry
	  micrometerCore
	  hdrHistogram
	  simpleClientCommon
	  simpleClientTracerCommon
	  simpleClientTracerOtelAgent
	  simpleClientTracerOtel
	  simpleClient
	  // 1.15.12 configurations
	  prometheusSimpleClientRegistry
	  micrometerCorev1512
	  micrometerCommons
	  simpleClient2Common
	  simpleClient2TracerCommon
	  simpleClient2TracerOtelAgent
	  simpleClient2TracerOtel
	  simpleClient2
}
	
dependencies {
  prometheusRegistry 'io.micrometer:micrometer-registry-prometheus:1.9.3'
  micrometerCore 'io.micrometer:micrometer-core:1.9.3'
  hdrHistogram 'org.hdrhistogram:HdrHistogram:2.1.12'
  simpleClientCommon 'io.prometheus:simpleclient_common:0.15.0'
  simpleClientTracerCommon 'io.prometheus:simpleclient_tracer_common:0.15.0'
  simpleClientTracerOtelAgent 'io.prometheus:simpleclient_tracer_otel_agent:0.15.0'
  simpleClientTracerOtel 'io.prometheus:simpleclient_tracer_otel:0.15.0'
  simpleClient 'io.prometheus:simpleclient:0.15.0'
  // 1.15.12 dependencies
  prometheusSimpleClientRegistry 'io.micrometer:micrometer-registry-prometheus-simpleclient:1.15.12'
  micrometerCorev1512 'io.micrometer:micrometer-core:1.15.12'
  micrometerCommons 'io.micrometer:micrometer-commons:1.15.12'
  simpleClient2Common 'io.prometheus:simpleclient_common:0.16.0'
  simpleClient2TracerCommon 'io.prometheus:simpleclient_tracer_common:0.16.0'
  simpleClient2TracerOtelAgent 'io.prometheus:simpleclient_tracer_otel_agent:0.16.0'
  simpleClient2TracerOtel 'io.prometheus:simpleclient_tracer_otel:0.16.0'
  simpleClient2 'io.prometheus:simpleclient:0.16.0'
}

task copyPrometheus(type: Copy) {
  shouldRunAfter jar
  from configurations.prometheusRegistry
  into new File(autoFvtDir, 'publish/shared/resources/prometheuslib/')
}

task copyHdrHistogramPrometheus(type: Copy) {
  shouldRunAfter jar
  from configurations.hdrHistogram
  into new File(autoFvtDir, 'publish/shared/resources/prometheuslib/')
}

task copyHdrHistogramUseless(type: Copy) {
  shouldRunAfter jar
  from configurations.hdrHistogram
  into new File(autoFvtDir, 'publish/shared/resources/uselessLib/')
}

task copyMicrometerCore(type: Copy) {
  shouldRunAfter jar
  from configurations.micrometerCore
  into new File(autoFvtDir, 'publish/shared/resources/micrometercore/')
}

task copySimpleClientCommon(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClientCommon
  into new File(autoFvtDir, 'publish/shared/resources/prometheuslib/')
}

task copySimpleClientTracerCommon(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClientTracerCommon
  into new File(autoFvtDir, 'publish/shared/resources/prometheuslib/')
}
task copySimpleClientTracerOtelAgent(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClientTracerOtelAgent
  into new File(autoFvtDir, 'publish/shared/resources/prometheuslib/')
}

task copySimpleClientTracerOtel(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClientTracerOtel
  into new File(autoFvtDir, 'publish/shared/resources/prometheuslib/')
}

task copySimpleClient(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClient
  into new File(autoFvtDir, 'publish/shared/resources/prometheuslib/')
}

task copyHdrHistogramPrometheusSimpleClient(type: Copy) {
  shouldRunAfter jar
  from configurations.hdrHistogram
  into new File(autoFvtDir, 'publish/shared/resources/prometheusSimpleClientLib/')
}

task copyPrometheusSimpleClientRegistry(type: Copy) {
  shouldRunAfter jar
  from configurations.prometheusSimpleClientRegistry
  into new File(autoFvtDir, 'publish/shared/resources/prometheusSimpleClientLib/')
}

task copyMicrometerCorev1512(type: Copy) {
  shouldRunAfter jar
  from configurations.micrometerCorev1512
  into new File(autoFvtDir, 'publish/shared/resources/micrometercorev1512/')
}

task copyMicrometerCommons(type: Copy) {
  shouldRunAfter jar
  from configurations.micrometerCommons
  into new File(autoFvtDir, 'publish/shared/resources/micrometercorev1512/')
}

task copySimpleClient2Common(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClient2Common
  into new File(autoFvtDir, 'publish/shared/resources/prometheusSimpleClientLib/')
}

task copySimpleClient2TracerCommon(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClient2TracerCommon
  into new File(autoFvtDir, 'publish/shared/resources/prometheusSimpleClientLib/')
}

task copySimpleClient2TracerOtelAgent(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClient2TracerOtelAgent
  into new File(autoFvtDir, 'publish/shared/resources/prometheusSimpleClientLib/')
}

task copySimpleClient2TracerOtel(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClient2TracerOtel
  into new File(autoFvtDir, 'publish/shared/resources/prometheusSimpleClientLib/')
}

task copySimpleClient2(type: Copy) {
  shouldRunAfter jar
  from configurations.simpleClient2
  into new File(autoFvtDir, 'publish/shared/resources/prometheusSimpleClientLib/')
}

addRequiredLibraries {
  dependsOn copyMicrometerCore
  dependsOn copyPrometheus
  dependsOn copyHdrHistogramPrometheus
  dependsOn copyHdrHistogramUseless
  dependsOn copySimpleClientCommon
  dependsOn copySimpleClientTracerCommon
  dependsOn copySimpleClientTracerOtelAgent
  dependsOn copySimpleClientTracerOtel
  dependsOn copySimpleClient
  dependsOn copyHdrHistogramPrometheusSimpleClient
  dependsOn copyPrometheusSimpleClientRegistry
  dependsOn copyMicrometerCorev1512
  dependsOn copyMicrometerCommons
  dependsOn copySimpleClient2Common
  dependsOn copySimpleClient2TracerCommon
  dependsOn copySimpleClient2TracerOtelAgent
  dependsOn copySimpleClient2TracerOtel
  dependsOn copySimpleClient2
  dependsOn addJakartaTransformer
}