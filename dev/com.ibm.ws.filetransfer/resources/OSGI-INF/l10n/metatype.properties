#CMVCPATHNAME com.ibm.ws.filetransfer/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE

remoteFileAccess.name=Remote File Access
remoteFileAccess.desc=This element contains artifacts that control the level of file access exposed for remote connections. 

readDir.name=Read access directory
readDir.desc=A directory that remote clients are allowed to read from. There can be multiple readDir elements, and each represents a single directory that may refer to variables or absolute paths.  Default is an empty set of directories

writeDir.name=Write access directory
writeDir.desc=A directory that remote clients are allowed to read from and write to. There can be multiple writeDir elements, and each represents a single directory that may refer to variables or absolute paths.  Default is an empty set of directories.

blockList.name=Block list directory
blockList.desc=A directory that clients are not allowed to read or write from, regardless of read/write config. There can be multiple writeDir elements, and each represents a single directory that may refer to variables or absolute paths. Default is ${server.output.dir}/resources/security

disableBlockList.name=Disable block list
disableBlockList.desc=A boolean flag to disable the block list. Default is false.

