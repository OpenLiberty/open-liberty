apply from: '../wlp-gradle/subprojects/maven-central-mirror.gradle'

dependencies {
  requiredLibs project(':com.ibm.ws.security.fat.common'),
               project(':com.ibm.ws.security.oauth.oidc_fat.common'),
               project(':com.ibm.ws.com.meterware.httpunit.1.6.2'),
               'jtidy:jtidy:4aug2000r7-dev',
               'rhino:js:1.6R5'
}

addRequiredLibraries.dependsOn addJakartaTransformer

/*
 * Configure any auto FVT artifacts.
 */
autoFVT.doLast {
  copy {
    from new File(project(':com.ibm.ws.security.oauth.oidc_fat.common').projectDir, 'publish/files/serversettings')
    into new File(autoFvtDir, 'publish/servers/com.ibm.ws.security.oauth.oidc_fat.common.metadataServer/imports')
    include 'fatTestPorts.xml'
  }
}