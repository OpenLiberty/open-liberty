apply plugin: 'war'

/*
 * This is where all application ZIP and WARs will be built.
 */
def appBuildDir = "${buildDir}/test-application"

// We aren't making a war for the entire project
war { enabled = false }

/******************************************************************
 ** BeanInterfaces.jar (shared by the EJB modules and client.war)
 ******************************************************************/
task BeanInterfaces_JAR(type: Jar, dependsOn: classes) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'BeanInterfaces.jar'

  from ('build/classes/java/main') {
    include 'csiv2/sample/shared/*.class'
  }
}

/******************************************************************
 ** DownstreamEJB.jar / DownstreamApp.ear
 ******************************************************************/
task DownstreamEJB_JAR(type: Jar, dependsOn: [classes, BeanInterfaces_JAR]) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'DownstreamEJB.jar'

  from ('build/classes/java/main') {
    include 'csiv2/sample/ejb/DownstreamBean*.class'
  }
  from (appBuildDir) {
    include 'BeanInterfaces.jar'
  }
}

task DownstreamApp_EAR(type: Zip, dependsOn: [DownstreamEJB_JAR, BeanInterfaces_JAR]) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'DownstreamApp.ear'

  from ('test-applications/DownstreamApp.ear/resources') {
    include 'META-INF/**'
  }
  from (appBuildDir) {
    include 'BeanInterfaces.jar'
    into 'lib'
  }
  from (appBuildDir) {
    include 'DownstreamEJB.jar'
  }
}

/******************************************************************
 ** IntermediateEJB.jar / IntermediateApp.ear
 ******************************************************************/
task IntermediateEJB_JAR(type: Jar, dependsOn: [classes, BeanInterfaces_JAR]) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'IntermediateEJB.jar'

  from ('build/classes/java/main') {
    include 'csiv2/sample/ejb/IntermediateBean*.class'
  }
  from (appBuildDir) {
    include 'BeanInterfaces.jar'
  }
}

task IntermediateApp_EAR(type: Zip, dependsOn: [IntermediateEJB_JAR, BeanInterfaces_JAR]) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'IntermediateApp.ear'

  from ('test-applications/IntermediateApp.ear/resources') {
    include 'META-INF/**'
  }
  from (appBuildDir) {
    include 'BeanInterfaces.jar'
    into 'lib'
  }
  from (appBuildDir) {
    include 'IntermediateEJB.jar'
  }
}

/******************************************************************
 ** SetWSSubjectBeanEJB.jar / GetWSSubjectBeanWeb.war / WSSubjectBeanApp.ear
 ******************************************************************/
task SetWSSubjectBeanEJB_JAR(type: Jar, dependsOn: classes) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'SetWSSubjectBeanEJB.jar'

  from ('build/classes/java/main') {
    include 'csiv2/sample/ejb/SetWSSubject*.class'
    include 'csiv2/sample/ejb/WSSubjectBean*.class'
  }
}

task GetWSSubjectBeanWeb_WAR(type: War, dependsOn: classes) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'GetWSSubjectBeanWeb.war'
  classpath = classpath.filter{ false }

  from ('build/classes/java/main') {
    include 'csiv2/sample/ejb/web/*.class'
    into 'WEB-INF/classes'
  }
}

task WSSubjectBeanApp_EAR(type: Zip, dependsOn: [SetWSSubjectBeanEJB_JAR, GetWSSubjectBeanWeb_WAR]) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'WSSubjectBeanApp.ear'

  from ('test-applications/WSSubjectBeanApp.ear/resources') {
    include 'META-INF/**'
  }
  from (appBuildDir) {
    include 'SetWSSubjectBeanEJB.jar'
    include 'GetWSSubjectBeanWeb.war'
  }
}

/******************************************************************
 ** csiv2Client.war / csiv2ClientApp.ear
 ******************************************************************/
task csiv2Client_WAR(type: War, dependsOn: classes) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'csiv2Client.war'
  classpath = classpath.filter{ false }

  from ('test-applications/csiv2Client.war/resources') {
    include 'WEB-INF/**'
  }
  from ('build/classes/java/main') {
    include 'web/CSIv2ClientServlet*.class'
    into 'WEB-INF/classes'
  }
}

task csiv2ClientApp_EAR(type: Zip, dependsOn: csiv2Client_WAR) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'csiv2ClientApp.ear'

  from ('test-applications/csiv2ClientApp.ear/resources') {
    include 'META-INF/**'
  }
  from (appBuildDir) {
    include 'csiv2Client.war'
  }
}

/******************************************************************
 ** client.war
 ******************************************************************/
task client_WAR(type: War, dependsOn: [classes, BeanInterfaces_JAR]) {
  destinationDirectory = file(appBuildDir)
  archiveFileName = 'client.war'
  classpath = classpath.filter{ false }

  from ('test-applications/client.war/resources') {
    include 'META-INF/**'
    include 'WEB-INF/**'
  }
  from ('build/classes/java/main') {
    include 'web/ClientServlet*.class'
    into 'WEB-INF/classes'
  }
  from (appBuildDir) {
    include 'BeanInterfaces.jar'
    into 'WEB-INF/lib'
  }
}

/******************************************************************
 ** Assemble all of the custom build artifacts.
 ******************************************************************/
assemble {
  dependsOn \
    DownstreamApp_EAR,
    IntermediateApp_EAR,
    WSSubjectBeanApp_EAR,
    csiv2ClientApp_EAR,
    client_WAR
}
