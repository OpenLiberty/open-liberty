configurations {
  derbyClient {
    transitive = false
  }
}

dependencies {
  derbyClient "org.apache.derby:derbyclient:${derbyJava8PlusVersion}"
}

//Derby network client driver, used by DerbyNoticeTest
task addDerbyClient(type: Copy) {
  mustRunAfter jar
  from configurations.derbyClient
  into new File(autoFvtDir, 'publish/shared/resources/derby')
  rename 'derbyclient-.*.jar', 'derbyclient.jar'
}

addRequiredLibraries.dependsOn addDerby
addRequiredLibraries.dependsOn addDerbyClient