// FAT Gradle config is automatically applied by the root build.gradle

configurations {
    requiredLibs
}

dependencies {
    requiredLibs 'org.testng:testng:7.5.1'
    requiredLibs project(':com.ibm.ws.crypto.passwordutil')
    requiredLibs 'org.apache.johnzon:johnzon-core:1.1.0'
    requiredLibs project(':io.openliberty.microprofile.health.internal_fat.common')
}

task addRequiredLibrariesLongInterval(type: Copy) {
    from configurations.requiredLibs
    into new File(autoFvtDir, 'lib/LibertyFATTestFiles/libs')
    shouldRunAfter autoFVT
}

addRequiredLibrariesLongInterval.dependsOn copyTestContainers
addRequiredLibrariesLongInterval.dependsOn addJakartaTransformer
zipAutoFVT.dependsOn addRequiredLibrariesLongInterval
