// Enable -Xlint:removal so the compiler emits the full [removal] warning
// for the deprecated addNode() call in OrderFormValidator, rather than the
// summary "Note: ... uses deprecated API marked for removal."
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:removal'
}
