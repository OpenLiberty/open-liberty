bootstrap.include=../testports.properties

# Original trace specification - produces excessive output (410MB+ trace files with 2.6M+ lines)
# The =all level includes FINEST which logs method entry/exit, generating 386K+ lines from security components alone
#com.ibm.ws.logging.trace.specification=*=info=enabled:\
#OpenIdConnect*=all:\
#OPENIDCONNECT*=all:\
#io.openliberty.security*=all:\
#com.ibm.ws.security.oauth*=all=enabled:\
#com.ibm.ws.security.jwt*=all=enabled:\
#com.ibm.ws.security.common*=all=enabled:\
#com.ibm.ws.webcontainer.security.*=all=enabled:\
#org.apache.http.client.*=all

# Optimized trace specification - uses =fine instead of =all to exclude FINEST/FINER method entry/exit tracing
# This still captures all error messages and important flow information needed by the tests
com.ibm.ws.logging.trace.specification=*=info=enabled:\
OpenIdConnect*=fine:\
OPENIDCONNECT*=fine:\
io.openliberty.security*=fine:\
com.ibm.ws.security.oauth*=all=enabled:\
com.ibm.ws.security.jwt*=fine=enabled:\
com.ibm.ws.security.common*=all=enabled:\
com.ibm.ws.webcontainer.security.*=fine=enabled

com.ibm.ws.logging.max.file.size=0
ds.loglevel=debug
