test {
    // Fork a new JVM for each test class to ensure isolation of static state.
    // This is required because ParserConfig reads system properties during
    // static initialization, and tests like SecurityLimitsDefaultTest,
    // ParserConfigTest, and SecurityLimitsCustomPropertiesTest set different
    // system properties that would interfere if run in the same JVM.
    forkEvery = 1
}