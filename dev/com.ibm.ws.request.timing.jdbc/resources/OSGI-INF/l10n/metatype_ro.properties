#CMVCPATHNAME com.ibm.ws.request.timing.jdbc/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE
#example=Sample configuration
jdbcTiming.name=Temporizarea JDBC
jdbcTiming.desc=\u00cenlocuie\u0219te valorile implicite specificate \u00een atributele de baz\u0103 ale requestTiming pentru opera\u021biunile JDBC.

dataSourceName.name=Nume surs\u0103 de date
dataSourceName.desc=Numele sursei de date care este monitorizat\u0103. Numele sursei de date este furnizat de informa\u0163iile de context din serviciul eventLogging-1.0. Dac\u0103 acest atribut nu este furnizat, sunt monitorizate toate numele de surse de date.

queryName.name=Nume de interogare
queryName.desc=Instruc\u0163iunea SQL care este monitorizat\u0103. Instruc\u0163iunea SQL este furnizat\u0103 de informa\u0163iile de context din serviciul eventLogging-1.0. Dac\u0103 acest atribut nu este furnizat, sunt monitorizate toate instruc\u0163iunile SQL.

slowRequestThreshold.name=Pragul de cerere lent\u0103
slowRequestThreshold.desc=Intervalul de timp \u00een care o opera\u021biune de tip \u201e JDBC \u201d poate rula \u00eenainte de a fi considerat\u0103 lent\u0103.

hungRequestThreshold.name=Pragul de cerere ag\u0103\u0163at\u0103
hungRequestThreshold.desc=Intervalul de timp \u00een care o opera\u021biune de tip \u201e JDBC \u201d poate rula \u00eenainte de a fi considerat\u0103 blocat\u0103.

enableThreadDumps=Activare dump-uri de fire de execu\u0163ie
enableThreadDumps.desc=Indic\u0103 dac\u0103 dump-urile de fire de execu\u0163ie sunt create c\u00e2nd este detectat\u0103 o cerere ag\u0103\u0163at\u0103. C\u00e2nd aceast\u0103 valoare este setat\u0103 la true (implicit), sunt create dump-uri de fire de execu\u0163ie. C\u00e2nd este setat\u0103 la false, dump-urile de fire de execu\u0163ie nu sunt create.

interruptHungRequest.name=\u00centreruperea cererilor blocate
interruptHungRequest.desc=Indic\u0103 dac\u0103 o opera\u021biune de tip \u201e JDBC \u201d care s-a blocat trebuie \u00eentrerupt\u0103. O valoare de True determin\u0103 caracteristica requestTiming-1.0 s\u0103 \u00eencerce s\u0103 \u00eentrerup\u0103 cererea blocat\u0103. O valoarea de False permite cererii s\u0103 continue s\u0103 ruleze.
