#CMVCPATHNAME com.ibm.ws.request.timing.jdbc/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE
#example=Sample configuration
jdbcTiming.name=Tempo JDBC
jdbcTiming.desc=Sovrascrive i valori predefiniti specificati negli attributi di root di requestTiming per le operazioni JDBC.

dataSourceName.name=Nome origine dati
dataSourceName.desc=Il nome dell'origine dati che viene monitorata. Il nome dell'origine dati viene fornito dalle informazioni di contesto nel servizio eventLogging-1.0. Se questo attributo non viene fornito, vengono monitorati tutti i nomi delle origini dati.

queryName.name=Nome query
queryName.desc=L'istruzione SQL che viene monitorata. L'istruzione SQL viene fornita dalle informazioni di contesto nel servizio eventLogging-1.0. Se questo attributo non viene fornito, vengono monitorate tutte le istruzioni SQL.

slowRequestThreshold.name=Soglia richieste lente
slowRequestThreshold.desc=Intervallo di tempo durante il quale un\u2019operazione \u201c JDBC \u201d pu\u00f2 essere eseguita prima di essere considerata lenta.

hungRequestThreshold.name=Soglia richieste bloccate
hungRequestThreshold.desc=Intervallo di tempo durante il quale un'operazione JDBC pu\u00f2 rimanere in esecuzione prima di essere considerata bloccata.

enableThreadDumps=Abilita dump dei thread
enableThreadDumps.desc=Indica se vengono creati i dump dei thread quando viene rilevata una richiesta bloccata. Quando questo valore \u00e8 impostato su (impostazione predefinita), i dump dei thread vengono creati. Quando impostato su false, i dump dei thread non vengono creati.

interruptHungRequest.name=Interrompi richieste bloccate
interruptHungRequest.desc=Indica se un\u2019operazione \u201c JDBC \u201d che si \u00e8 bloccata debba essere interrotta. Il valore true causa il tentativo da parte della funzione requestTiming-1.0 di interrompere la richiesta bloccata. Il valore false permette la continuazione dell'esecuzione della richiesta.
