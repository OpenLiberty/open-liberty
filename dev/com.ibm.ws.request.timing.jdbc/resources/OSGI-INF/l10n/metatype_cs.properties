#CMVCPATHNAME com.ibm.ws.request.timing.jdbc/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE
#example=Sample configuration
jdbcTiming.name=\u010casov\u00e1n\u00ed JDBC
jdbcTiming.desc=P\u0159ep\u00ed\u0161e v\u00fdchoz\u00ed nastaven\u00ed, kter\u00e1 jsou uvedena v ko\u0159enov\u00fdch atributech requestTiming pro operace JDBC.

dataSourceName.name=N\u00e1zev zdroje dat
dataSourceName.desc=N\u00e1zev monitorovan\u00e9ho zdroje dat. N\u00e1zev zdroje dat je poskytnut informacemi o kontextu ve slu\u017eb\u011b eventLogging-1.0. Pokud tento atribut nen\u00ed poskytnut, jsou monitorov\u00e1ny v\u0161echny n\u00e1zvy zdroje dat.

queryName.name=N\u00e1zev dotazu
queryName.desc=Monitorovan\u00fd p\u0159\u00edkaz SQL. P\u0159\u00edkaz SQL je poskytnut informacemi o kontextu ve slu\u017eb\u011b eventLogging-1.0. Pokud tento atribut nen\u00ed poskytnut, jsou monitorov\u00e1ny v\u0161echny p\u0159\u00edkazy SQL.

slowRequestThreshold.name=Prahov\u00e1 hodnota pro pomal\u00e9 po\u017eadavky
slowRequestThreshold.desc=Doba, po kterou m\u016f\u017ee operace typu \u201e JDBC \u201c prob\u00edhat, ne\u017e bude pova\u017eov\u00e1na za pomalou.

hungRequestThreshold.name=Prahov\u00e1 hodnota pro zablokovan\u00e9 po\u017eadavky
hungRequestThreshold.desc=Doba, po kterou m\u016f\u017ee operace typu \u201e JDBC \u201c b\u011b\u017eet, ne\u017e bude pova\u017eov\u00e1na za zaseknutou.

enableThreadDumps=Povolit v\u00fdpisy pam\u011bti podprocesu
enableThreadDumps.desc=Ozna\u010duje, zda jsou p\u0159i zji\u0161t\u011bn\u00ed zablokovan\u00e9ho po\u017eadavku vytvo\u0159eny v\u00fdpisy pam\u011bti podprocesu. Je-li tato vlastnost nastavena na true (v\u00fdchoz\u00ed), jsou vytvo\u0159eny v\u00fdpisy pam\u011bti podprocesu. P\u0159i nastaven\u00ed na false, se v\u00fdpisy pam\u011bti podprocesu nevytvo\u0159\u00ed.

interruptHungRequest.name=P\u0159eru\u0161it zablokovan\u00e9 po\u017eadavky
interruptHungRequest.desc=Ur\u010duje, zda m\u00e1 b\u00fdt p\u0159eru\u0161ena operace typu \u201e JDBC \u201c, kter\u00e1 se zasekla. Hodnota true zp\u016fsob\u00ed, \u017ee se funkce requestTiming-1.0 pokus\u00ed p\u0159eru\u0161it zablokovan\u00fd po\u017eadavek. Hodnota false umo\u017en\u00ed po\u017eadavku pokra\u010dovat ve zpracov\u00e1n\u00ed.
