#CMVCPATHNAME com.ibm.ws.request.timing.jdbc/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE
#example=Sample configuration
jdbcTiming.name=Czas JDBC
jdbcTiming.desc=Zast\u0119puje warto\u015bci domy\u015blne okre\u015blone w atrybutach g\u0142\u00f3wnych pliku ` requestTiming ` dla operacji ` JDBC `.

dataSourceName.name=Nazwa \u017ar\u00f3d\u0142a danych
dataSourceName.desc=Nazwa monitorowanego \u017ar\u00f3d\u0142a danych. Nazwa \u017ar\u00f3d\u0142a danych jest udost\u0119pniana przez informacje kontekstowe w us\u0142udze eventLogging-1.0. Je\u015bli ten atrybut nie zostanie podany, b\u0119d\u0105 monitorowane wszystkie nazwy \u017ar\u00f3de\u0142 danych.

queryName.name=Nazwa zapytania
queryName.desc=Monitorowana instrukcja SQL. Instrukcja SQL jest udost\u0119pniana przez informacje kontekstowe w us\u0142udze eventLogging-1.0. Je\u015bli ten atrybut nie zostanie podany, b\u0119d\u0105 monitorowane wszystkie instrukcje SQL.

slowRequestThreshold.name=Pr\u00f3g powolnych \u017c\u0105da\u0144
slowRequestThreshold.desc=Czas, przez jaki operacja typu \u201e JDBC \u201d mo\u017ce trwa\u0107, zanim zostanie uznana za powoln\u0105.

hungRequestThreshold.name=Pr\u00f3g zawieszonych \u017c\u0105da\u0144
hungRequestThreshold.desc=Czas, przez jaki operacja typu \u201e JDBC \u201d mo\u017ce trwa\u0107, zanim zostanie uznana za zawieszon\u0105.

enableThreadDumps=W\u0142\u0105cz zrzuty w\u0105tk\u00f3w
enableThreadDumps.desc=Wskazuje, czy w razie wykrycia zawieszonego \u017c\u0105dania tworzone s\u0105 zrzuty w\u0105tk\u00f3w. Warto\u015b\u0107 true (domy\u015blna) powoduje, \u017ce zrzuty w\u0105tk\u00f3w s\u0105 tworzone. Warto\u015b\u0107 false powoduje, \u017ce zrzuty w\u0105tk\u00f3w nie s\u0105 tworzone.

interruptHungRequest.name=Przerwanie zawieszonych \u017c\u0105da\u0144
interruptHungRequest.desc=Wskazuje, czy nale\u017cy przerwa\u0107 zawieszon\u0105 operacj\u0119 typu \u201e JDBC \u201d. Warto\u015b\u0107 true powoduje, \u017ce funkcja requestTiming-1.0 podejmuje pr\u00f3b\u0119 przerwania zawieszonego \u017c\u0105dania. Warto\u015b\u0107 false umo\u017cliwia kontynuowanie dzia\u0142ania \u017c\u0105dania.
