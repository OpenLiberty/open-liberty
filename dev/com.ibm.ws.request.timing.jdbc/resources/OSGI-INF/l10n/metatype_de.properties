#CMVCPATHNAME com.ibm.ws.request.timing.jdbc/resources/OSGI-INF/l10n/metatype.properties
#ISMESSAGEFILE FALSE
#NLS_ENCODING=UNICODE
#NLS_MESSAGEFORMAT_NONE
#example=Sample configuration
jdbcTiming.name=JDBC-Timing
jdbcTiming.desc=\u00dcberschreibt die in den Stammattributen von \u201e requestTiming \u201c festgelegten Standardwerte f\u00fcr Vorg\u00e4nge unter \u201e JDBC \u201c.

dataSourceName.name=Datenquellenname
dataSourceName.desc=Der Name der Datenquelle, die \u00fcberwacht wird. Der Datenquellenname wird \u00fcber die Kontextinformationen im eventLogging-1.0-Service bereitgestellt. Wenn das Attribut nicht angegeben wird, werden alle Datenquellennamen \u00fcberwacht.

queryName.name=Abfragename
queryName.desc=Die SQL-Anweisung, die \u00fcberwacht wird. Die SQL-Anweisung wird \u00fcber die Kontextinformationen im eventLogging-1.0-Service bereitgestellt. Wenn das Attribut nicht angegeben wird, werden alle SQL-Anweisungen \u00fcberwacht.

slowRequestThreshold.name=Schwellenwert f\u00fcr langsame Anforderungen
slowRequestThreshold.desc=Zeitraum, in dem ein \u201e JDBC \u201c-Vorgang laufen kann, bevor er als langsam eingestuft wird.

hungRequestThreshold.name=Schwellenwert f\u00fcr blockierte Anforderungen
hungRequestThreshold.desc=Zeitdauer, w\u00e4hrend der ein JDBC -Vorgang laufen kann, bevor er als \u201eh\u00e4ngend\u201c gilt.

enableThreadDumps=Threadspeicherausz\u00fcge aktivieren
enableThreadDumps.desc=Gibt an, ob Threadspeicherausz\u00fcge erstellt werden, wenn eine Blockierungsanforderung erkannt wird. Wenn dieser Wert auf true (Standardeinstellung) gesetzt ist, werden Threadspeicherausz\u00fcge erstellt. Wenn der Wert auf false gesetzt ist, werden keine Threadspeicherausz\u00fcge erstellt.

interruptHungRequest.name=Blockierte Anforderungen unterbrechen
interruptHungRequest.desc=Gibt an, ob ein h\u00e4ngender \u201e JDBC \u201c-Vorgang abgebrochen werden soll. Der Wert true bewirkt, dass das Feature requestTiming-1.0 versucht, die blockierte Anforderung zu unterbrechen. Der Wert false l\u00e4sst die Fortsetzung der Anforderung zu.
