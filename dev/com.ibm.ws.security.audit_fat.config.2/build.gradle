apply plugin: 'war'

// We aren't making a war for the entire project
war { enabled = false }

configurations {
  requiredLibs {
    transitive = false
  }
}

dependencies {
  requiredLibs 'org.apache.httpcomponents:httpclient:4.1.2',
               'org.apache.httpcomponents:httpcore:4.1.2',
               project(':com.ibm.ws.security.audit_fat.common.tooling'),
               project(':com.ibm.ws.security.audit_fat.config.1'),
               project(':com.ibm.ws.security.fat.common'),
               project(':com.ibm.json4j')
}

/*
 * This FAT reuses the servers of com.ibm.ws.security.audit_fat.config.1, and the
 * audit test applications and keystores of the tooling project.
 */
autoFVT.dependsOn ':com.ibm.ws.security.audit_fat.common.tooling:assemble'

autoFVT.doLast {
  def config1 = project(':com.ibm.ws.security.audit_fat.config.1')
  def tooling = project(':com.ibm.ws.security.audit_fat.common.tooling')
  def appDir = new File(tooling.buildDir, 'test-application')
  def keyDir = new File(tooling.projectDir, 'securitykeys')
  def serverDir = { String server -> new File(autoFvtDir, "publish/servers/${server}") }

  /*
   * Start from the servers and files of config.1.
   */
  copy {
    from new File(config1.projectDir, 'publish')
    into new File(autoFvtDir, 'publish')
  }

  /*
   * Servers that need both audit applications.
   */
  ['com.ibm.ws.security.audit.fat.config',
   'com.ibm.ws.security.audit.fat.logging'].each { server ->
    copy {
      from new File(appDir, 'AuditBasicAuthServlet.war')
      from new File(appDir, 'AuditFormLoginServlet.war')
      into new File(serverDir(server), 'apps')
    }
  }

  /*
   * Servers that need only the basic auth application.
   */
  ['com.ibm.ws.security.audit.fat.uniqueserver',
   'com.ibm.ws.security.audit.fat.uniqueserver.env',
   'com.ibm.ws.security.audit.fat.securelog',
   'com.ibm.ws.security.audit.fat.securelogerror',
   'com.ibm.ws.security.audit.fat.securelogging',
   'com.ibm.ws.security.audit.fat.jsonlog'].each { server ->
    copy {
      from new File(appDir, 'AuditBasicAuthServlet.war')
      into new File(serverDir(server), 'apps')
    }
  }

  /*
   * Copy the keystores to the servers that sign and/or encrypt the audit log.
   */
  copy {
    from keyDir
    include 'AuditEncryptionPublicKeyKeystore.jks',
            'AuditEncryptionKeyStore2.jks',
            'AuditEncryptionKeyStore.jks',
            'AuditSigningKeyStore.jks',
            'AuditSigningKeyStore2.jks',
            'AuditCertPasswordKeystore.jks',
            'key.jks'
    into new File(serverDir('com.ibm.ws.security.audit.fat.securelog'), 'resources/security')
  }
  copy {
    from keyDir
    include 'AuditEncryptionPublicKeyKeystore.jks',
            'AuditEncryptionKeyStore2.jks',
            'AuditEncryptionKeyStore.jks',
            'AuditSigningKeyStore.jks',
            'AuditSigningKeyStore2.jks'
    into new File(serverDir('com.ibm.ws.security.audit.fat.securelogerror'), 'resources/security')
  }
  ['com.ibm.ws.security.audit.fat.securelogging',
   'com.ibm.ws.security.audit.fat.jsonlog'].each { server ->
    copy {
      from keyDir
      include 'AuditEncryptionKeyStore.jks',
              'AuditSigningKeyStore2.jks'
      into new File(serverDir(server), 'resources/security')
    }
  }
}
