configurations {
  requiredLibs {
    transitive = false
  }
}

dependencies {
  requiredLibs project(':com.ibm.ws.security.fat.common.jwt'),
               project(':com.ibm.ws.org.jose4j'),
               project(':com.ibm.ws.org.apache.httpcomponents'),
               project(':io.openliberty.org.apache.commons.codec')
}

addRequiredLibraries.dependsOn addJakartaTransformer

autoFVT.dependsOn ':com.ibm.ws.security.fat.common:assemble'
autoFVT.dependsOn ':com.ibm.ws.security.fat.common.jwt:assemble'

autoFVT {
  def securityCommonProject = project(':com.ibm.ws.security.fat.common')
  def jwtCommonProject = project(':com.ibm.ws.security.fat.common.jwt')

  doLast {
    ['RestJwtServer', 'RestJwtNoConnectorServer', 'RestJwtKeyFileServer'].each { server ->
      // Copy server files
      copy {
        from file('publish/servers/' + server)
        into new File(autoFvtDir, 'publish/servers/' + server)
      }

      // Copy shared security keys
      copy {
        from securityCommonProject.file('publish/shared/securityKeys')
        into new File(autoFvtDir, 'publish/servers/' + server + '/resources/security')
      }
      copy {
        from jwtCommonProject.file('publish/shared/securityKeys')
        into new File(autoFvtDir, 'publish/servers/' + server + '/resources/security')
      }
    }

    def publishBaseDir = new File(autoFvtDir, 'publish')
    defaultCopyLTPAFIPSKeys(publishBaseDir)
  }
}
