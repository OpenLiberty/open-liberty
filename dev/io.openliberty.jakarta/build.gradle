configurations {
  cdi40 {
    canBeResolved = true
  }
}

artifacts {
  cdi40(file('build/libs/io.openliberty.jakarta.cdi.4.0.jar'))
}

task validateBndFiles {
  group = 'verification'
  description = 'Validates that the bnd files have the -maven-dependencies instruction'
  doLast {
    // Find all .bnd files in the root of the project excluding bnd.bnd
    def subBudleBndFiles = projectDir.listFiles().findAll { file ->
      file.isFile() && file.name.endsWith('.bnd') && file.name != 'bnd.bnd'
    }

    def missingFiles = []

    subBudleBndFiles.each { bndFile ->
      // Check if this file contains the '-maven-dependencies' instruction
      boolean hasInstruction = bndFile.readLines().any { line ->
        def trimmed = line.trim()
          return trimmed.startsWith('-maven-dependencies')
        }

        if (!hasInstruction) {
          missingFiles << bndFile.name
        }
    }

    // Fail if any file is missing the instruction
    if (!missingFiles.isEmpty()) {
      throw new GradleException(
        "Validation failed: The following .bnd file(s) are missing the required '-maven-dependencies' instruction: ${missingFiles.join(', ')}"
      )
    }
  }
}

compileJava.dependsOn validateBndFiles