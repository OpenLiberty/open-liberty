CWWKS4201E=CWWKS4201E: LTPA-Token-Validierung fehlgeschlagen. Das Token enth\u00e4lt keine PQC-Signatur und pqcValidationMode ist auf ''pqc-required'' gesetzt.
CWWKS4202I=CWWKS4202I: PQC-LTPA ist aktiviert mit Algorithmus {0} und Validierungsmodus {1}.
CWWKS4203I=CWWKS4203I: LTPA-Token mit PQC-Signatur erstellt unter Verwendung von Algorithmus {0}.
