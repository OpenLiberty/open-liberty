#===== LTPA TOKEN CONFIGURATION ====
ltpa.token.config=LTPA Token
ltpa.token.config.desc=Lightweight Third Party Authentication (LTPA) token configuration.

keysFileName=The LTPA primary keys file
keysFileName.desc=The path to the file that contains the LTPA primary keys, which are used to create and validate LTPA tokens.

keysPassword=LTPA primary keys password
keysPassword.desc=Password for the LTPA primary keys. If no value is specified, the 'ltpa_keys_password' or 'keystore_password' value from the ${server.config.dir}/server.env file is used if they are set. If both are set, the 'ltpa_keys_password' takes precedence over the 'keystore_password'. A password must be specified in this attribute, or in the 'ltpa_keys_password' or 'keystore_password' environment variables. The best practice is to encrypt the password by using the securityUtility tool.

expiration=LTPA token expiration
expiration.desc=Amount of time after which a token expires in seconds. The value can be specified in milliseconds, seconds, and minutes by using the following suffixes: "ms", "s", and "m".

ltpa.monitorInterval=LTPA keys file polling rate
ltpa.monitorInterval.desc=Rate at which the server checks for updates to the LTPA keys file. This rate applies to both the primary keys and the validation keys.

ltpa.monitorValidationKeysDir=LTPA monitor validation keys directory
ltpa.monitorValidationKeysDir.desc=If set to "true", the directory that contains LTPA primary keys is monitored for any modifications on files with the .keys suffix. The default value is false. All validation files must use the same password as the LTPA primary keys password and must have the .keys suffix.

ltpa.updateTrigger=LTPA keys update trigger
ltpa.updateTrigger.desc=Specifies the update method or trigger that is used to update the LTPA keys. The following values are supported: "polled", "mbean" and "disabled". The default value is "polled".
ltpa.updateTrigger.timed=The server scans for LTPA key file changes at the monitor interval and updates if the LTPA key files have any detectable changes. 
ltpa.updateTrigger.mbean=All the LTPA keys are reloaded when triggered by an MBean call. This is typically called by an external program, such as an integrated development environment or a management application.
ltpa.updateTrigger.disabled=This disables all update monitoring on all LTPA key files including primary key and validation keys (configured and non-configured). Changes to the LTPA key files are not applied while the server is running.

authFilterRef=Authentication Filter Reference
authFilterRef$Ref=Authentication filter reference
authFilterRef.desc=Specifies the authentication filter reference. 

validationKeys=LTPA Validation Keys
validationKeys.desc=The LTPA keys that are used only for validating existing LTPA tokens, not for creating new LTPA tokens.

fileName=LTPA validation keys file
fileName.desc=The name of the file that contains the LTPA validation keys. The path must be the same as the LTPA primary keys file.

password=LTPA validation keys password
password.desc=The password for the LTPA validation keys. The best practice is to encrypt the password by using the securityUtility tool.

validUntilDate=LTPA validation keys valid until date
validUntilDate.desc=A date and time value in ISO date format that the LTPA validation key is valid until. After the specified time, the validation keys is no longer used for LTPA token validation. The following example shows the ISO date format: "2023-11-18T18:08:35Z". If no value is specified, the LTPA validation keys can be used indefinitely.

pqcEnabled=Enable Post-Quantum Cryptography
pqcEnabled.desc=Enable Post-Quantum Cryptography (PQC) hybrid signatures for LTPA tokens. When enabled, tokens will include both classical RSA-2048 and quantum-resistant ML-DSA signatures. Default is false for backward compatibility.

pqcAlgorithm=PQC signature algorithm
pqcAlgorithm.desc=The Post-Quantum Cryptography signature algorithm to use for LTPA tokens. ML-DSA-65 (NIST FIPS 204) is recommended for most deployments, providing NIST Security Level 3 (equivalent to AES-192). ML-DSA-44 offers faster performance with lower security, while ML-DSA-87 provides higher security at the cost of performance.
pqcAlgorithm.ML-DSA-44=ML-DSA-44 (NIST Level 2, faster)
pqcAlgorithm.ML-DSA-65=ML-DSA-65 (NIST Level 3, recommended)
pqcAlgorithm.ML-DSA-87=ML-DSA-87 (NIST Level 5, highest security)

pqcValidationMode=PQC token validation mode
pqcValidationMode.desc=Controls how LTPA tokens are validated. 'hybrid' mode accepts both classical and PQC tokens (recommended for migration). 'pqc-required' mode rejects classical tokens and requires PQC signatures. 'classical-only' mode ignores PQC signatures and validates only classical RSA signatures.
pqcValidationMode.hybrid=Hybrid (accept classical or PQC tokens)
pqcValidationMode.pqc-required=PQC required (reject classical tokens)
pqcValidationMode.classical-only=Classical only (ignore PQC signatures)

pqcKeysFileName=PQC keys file name
pqcKeysFileName.desc=The name of the file that contains the Post-Quantum Cryptography keys for LTPA. This file stores the ML-DSA public and private keys used for quantum-resistant token signatures. The file is separate from the classical LTPA keys file to enable independent key rotation.

pqcKeysPassword=PQC keys password
pqcKeysPassword.desc=The password used to encrypt the PQC keys file. If not specified, the value of the keysPassword attribute is used. The password can be encoded using the securityUtility encode command.

#===== PQC CONFIGURATION ERROR MESSAGES =====
CWWKS4200E=CWWKS4200E: PQC-LTPA configuration error. The pqcAlgorithm attribute value ''{0}'' is not supported. Supported values are: ML-DSA-44, ML-DSA-65, ML-DSA-87.
CWWKS4200E.explanation=The configured PQC algorithm is not one of the supported ML-DSA variants defined in NIST FIPS 204.
CWWKS4200E.useraction=Change the pqcAlgorithm attribute to one of the supported values: ML-DSA-44, ML-DSA-65, or ML-DSA-87.

CWWKS4201E=CWWKS4201E: PQC-LTPA configuration error. The pqcValidationMode attribute value ''{0}'' is not supported. Supported values are: hybrid, pqc-required, classical-only.
CWWKS4201E.explanation=The configured PQC validation mode is not one of the supported modes.
CWWKS4201E.useraction=Change the pqcValidationMode attribute to one of the supported values: hybrid (accepts both classical and PQC tokens), pqc-required (requires PQC signatures), or classical-only (ignores PQC signatures).

CWWKS4202I=CWWKS4202I: PQC-LTPA keys file name was not specified. Auto-generated file name: {0}
CWWKS4202I.explanation=When PQC is enabled but no pqcKeysFileName is specified, the system automatically generates a file name based on the primary LTPA keys file by appending '-pqc' before the '.keys' extension.
CWWKS4202I.useraction=No action is required. To use a different file name, specify the pqcKeysFileName attribute in the LTPA configuration.

CWWKS4203E=CWWKS4203E: PQC-LTPA configuration error. PQC is enabled but the pqcKeysFileName attribute is not specified and cannot be auto-generated.
CWWKS4203E.explanation=When PQC is enabled, a PQC keys file name must be specified or the system must be able to auto-generate one from the primary LTPA keys file name. Auto-generation requires that the keysFileName attribute is properly configured.
CWWKS4203E.useraction=Specify the pqcKeysFileName attribute in the LTPA configuration, or ensure the keysFileName attribute is properly configured so the system can auto-generate the PQC keys file name.

CWWKS4210W=CWWKS4210W: PQC-LTPA is enabled but Post-Quantum Cryptography is not available. Falling back to classical LTPA mode.
CWWKS4210W.explanation=The PQC provider classes are not available or cannot be loaded. This may occur if the required Java version (Java 21+ for native support) or BouncyCastle PQC library (for Java 8-17) is not present in the classpath.
CWWKS4210W.useraction=For native PQC support, ensure Java 21 or later is installed. For Java 8-17, add the BouncyCastle PQC library (bcpqc-jdk18on version 1.78 or later) to the server classpath. If PQC support is not required, set pqcEnabled="false" in the LTPA configuration to suppress this warning.

LTPA_PQC_KEYS_PASSWORD_ERROR=LTPA_PQC_KEYS_PASSWORD_ERROR: PQC-LTPA configuration error. PQC is enabled but no password could be resolved for the PQC keys file. A password must be specified in the pqcKeysPassword attribute, the keysPassword attribute, or in the 'ltpa_keys_password' or 'keystore_password' environment variables.

CWWKS4211E=CWWKS4211E: PQC-LTPA is enabled but the PQC keys file does not exist: {0}
CWWKS4211E.explanation=The PQC keys file specified in the pqcKeysFileName attribute or auto-generated from the primary LTPA keys file name does not exist. The file must exist or be created before PQC-LTPA can be used.
CWWKS4211E.useraction=Ensure the PQC keys file exists at the specified location. If the file does not exist, it will be automatically created when the server starts if the directory is writable. Alternatively, use the securityUtility createLTPAKeys command with the --pqc option to manually create the PQC keys file.

CWWKS4212A=CWWKS4212A: PQC-LTPA configuration changed. PQC enabled: {0}, PQC keys file: {1}
CWWKS4212A.explanation=The PQC-LTPA configuration has been dynamically updated. The pqcEnabled attribute or pqcKeysFileName attribute has changed, requiring the LTPA keys to be reloaded.
CWWKS4212A.useraction=No action is required. This is an informational message indicating that the PQC-LTPA configuration has been successfully updated.

CWWKS4213I=CWWKS4213I: PQC-LTPA settings updated. Algorithm: {0}, Validation mode: {1}
CWWKS4213I.explanation=The PQC-LTPA algorithm or validation mode settings have been dynamically updated. These changes do not require reloading the LTPA keys.
CWWKS4213I.useraction=No action is required. This is an informational message indicating that the PQC-LTPA settings have been successfully updated.