CWWKS4208E=CWWKS4208E: \u00c9chec de la cr\u00e9ation de la signature PQC pour le jeton LTPA. Erreur: {0}
CWWKS4209E=CWWKS4209E: \u00c9chec de la validation de la signature PQC dans le jeton LTPA. Erreur: {0}
CWWKS4210W=CWWKS4210W: PQC-LTPA est activ\u00e9 mais la cryptographie post-quantique n'est pas disponible sur cette version de Java. Retour au mode LTPA classique. PQC n\u00e9cessite Java 21+ avec BouncyCastle ou Java 24+.
CWWKS4211E=CWWKS4211E: Erreur de configuration PQC-LTPA. L'attribut pqcKeysFileName sp\u00e9cifie un fichier qui n'existe pas et ne peut pas \u00eatre cr\u00e9\u00e9: {0}
CWWKS4212A=CWWKS4212A: Configuration PQC-LTPA modifi\u00e9e. Algorithme: {0}, Mode de validation: {1}, Fichier de cl\u00e9s: {2}
