wsat.name=WS-AtomicTransaction
wsat.name.description=Vlastnosti konfigurace funkce Web Services Atomic Transaction.
sslenabled.name=Povolit zabezpe\u010den\u00ed SSL
sslenabled.description=P\u0159i nastaven\u00ed na true jsou zpr\u00e1vy intern\u00ed ud\u00e1losti WS-AtomicTransaction odeslan\u00e9 mezi koordin\u00e1torem WS-AT a \u00fa\u010dastn\u00edkem za\u0161ifrov\u00e1ny pomoc\u00ed SSL.
sslref.name=Odkaz na SSL
sslref.description=Ur\u010duje konfiguraci SSL, kter\u00e1 se m\u00e1 pou\u017e\u00edt pro protokol WS-AtomicTransaction, kdy\u017e je povoleno SSL.
clientAuth.name=Povoleno ov\u011b\u0159ov\u00e1n\u00ed klienta SSL
clientAuth.description=Ur\u010duje, zda je pro protokol WS-AtomicTransaction povoleno i dal\u0161\u00ed ov\u011b\u0159ov\u00e1n\u00ed klienta, kdy\u017e je povoleno SSL.
proxy.name=Adresa serveru proxy
proxy.description=Voliteln\u011b ur\u010duje hostitele a adresu portu serveru proxy, kter\u00fd se pou\u017e\u00edv\u00e1 ke sm\u011brov\u00e1n\u00ed protokolu WS-AtomicTransaction.
asyncResponseTimeout.name=\u010casov\u00fd limit asynchronn\u00ed odezvy
asyncResponseTimeout.description=Ur\u010duje dobu, po kterou server \u010dek\u00e1 na p\u0159\u00edchoz\u00ed odpov\u011b\u010f protokolu WS-AT, ne\u017e znovu ode\u0161le p\u0159edchoz\u00ed zpr\u00e1vu protokolu WS-AT.
virtualHostRef.name=P\u0159\u00edru\u010dka k virtu\u00e1ln\u00edm hostitel\u016fm
virtualHostRef.description=Ur\u010duje virtu\u00e1ln\u00ed hostitel, kter\u00fd se m\u00e1 pou\u017e\u00edt pro webovou aplikaci WS-AtomicTransaction. V\u00fdchoz\u00ed hodnota je default_host.
propagation.name=Zp\u016fsob \u0161\u00ed\u0159en\u00ed
propagation.description=Ur\u010duje, kdy server \u0161\u00ed\u0159\u00ed kontext koordinace odchoz\u00ed atomick\u00e9 transakce webov\u00fdch slu\u017eeb (WS-AT). V\u00fdchoz\u00ed hodnotou je \u201ev\u017edy\u201c, co\u017e znamen\u00e1, \u017ee kontext se p\u0159ed\u00e1v\u00e1 bezpodm\u00edne\u010dn\u011b. Nastavte hodnotu na \u201echeck_wsdl\u201c, aby se kontext p\u0159ed\u00e1val pouze na koncov\u00e9 body, jejich\u017e z\u00e1sady ve form\u00e1tu WSDL (Web Services Description Language) obsahuj\u00ed tvrzen\u00ed WS-AT.
propagation.always=v\u017edy
propagation.check_wsdl=check_wsdl
