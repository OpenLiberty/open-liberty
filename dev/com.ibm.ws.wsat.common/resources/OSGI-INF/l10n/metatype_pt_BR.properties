wsat.name=WS-AtomicTransaction
wsat.name.description=Propriedades de configura\u00e7\u00e3o para o recurso Web Services Atomic Transaction.
sslenabled.name=SSL ativado
sslenabled.description=Quando configurado como true, as mensagens internas do evento WS-AtomicTransaction enviadas entre o coordenador e o participante do WS-AT s\u00e3o criptografadas usando SSL.
sslref.name=Refer\u00eancia SSL
sslref.description=Especifica a configura\u00e7\u00e3o de SSL a ser usada para o protocolo WS-AtomicTransaction quando o SSL est\u00e1 ativado.
clientAuth.name=Autentica\u00e7\u00e3o de cliente SSL ativada
clientAuth.description=Especifica se a autentica\u00e7\u00e3o de cliente adicional est\u00e1 ativada para o protocolo WS-AtomicTransaction quando o SSL est\u00e1 ativado.
proxy.name=Endere\u00e7o do Servidor Proxy
proxy.description=Especifica, como o op\u00e7\u00e3o, o endere\u00e7o do host e da porta de um servidor proxy usado para rotear o protocolo WS-AtomicTransaction.
asyncResponseTimeout.name=Tempo Limite de Resposta Ass\u00edncrono
asyncResponseTimeout.description=Especifica a quantidade de tempo que o servidor espera por uma resposta do protocolo WS-AT de entrada antes de reenviar a mensagem do protocolo WS-AT anterior
virtualHostRef.name=Refer\u00eancia sobre hosts virtuais
virtualHostRef.description=Especifica o host virtual a ser usado para o aplicativo web WS-AtomicTransaction. O valor padr\u00e3o \u00e9 default_host.
propagation.name=Modo de propaga\u00e7\u00e3o
propagation.description=Determina quando o servidor propaga o contexto de coordena\u00e7\u00e3o da Transa\u00e7\u00e3o At\u00f4mica de Servi\u00e7os da Web (WS-AT) de sa\u00edda. O valor padr\u00e3o \u00e9 \u201csempre\u201d, o que faz com que o contexto seja propagado incondicionalmente. Defina o valor como \u201ccheck_wsdl\u201d para propagar o contexto apenas aos pontos de extremidade cuja pol\u00edtica da Linguagem de Descri\u00e7\u00e3o de Servi\u00e7os da Web (WSDL) inclua uma asser\u00e7\u00e3o WS-AT.
propagation.always=always
propagation.check_wsdl=check_wsdl
